<!DOCTYPE html>
<html lang="ar" dir="rtl" class="h-full select-none">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>منصة الامتحانات الإلكترونية الاحترافية</title>
  
  <!-- خط كايرا العربي وتنسيقات التصميم -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: { cairo: ['Cairo', 'Tahoma', 'sans-serif'] },
          colors: {
            brand: { 50: '#ecfdf5', 100: '#d1fae5', 500: '#10b981', 600: '#059669', 700: '#047857' }
          }
        }
      }
    }
  </script>

  <style>
    body { font-family: 'Cairo', Tahoma, sans-serif; -webkit-tap-highlight-color: transparent; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    
    /* تنسيقات خاصة بطباعة شهادة التقدير فقط */
    @media print {
      body * { visibility: hidden; }
      #printable-certificate, #printable-certificate * { visibility: visible; }
      #printable-certificate { position: fixed; inset: 0; margin: auto; max-width: 100%; border: none !important; box-shadow: none !important; }
      .no-print { display: none !important; }
    }
  </style>
</head>
<body class="h-full bg-slate-50 text-slate-800 dark:bg-slate-950 dark:text-slate-100 transition-colors duration-200 flex flex-col justify-between">

  <!-- شريط التنبيهات المنبثقة -->
  <div id="toast-container" class="fixed top-4 left-4 right-4 sm:left-auto sm:right-5 sm:top-5 z-50 flex flex-col gap-2 pointer-events-none"></div>

  <!-- الهيكل العام للمنصة -->
  <div class="min-h-screen flex flex-col justify-between pb-20 md:pb-0">
    <div>
      <!-- شريط علوي أنيق ومتجاوب -->
      <header class="sticky top-0 z-40 bg-white/95 dark:bg-slate-900/95 backdrop-blur border-b border-slate-200 dark:border-slate-800 shadow-sm">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 h-14 sm:h-16 flex items-center justify-between">
          <div class="flex items-center gap-2.5 cursor-pointer" onclick="navigate('#home')">
            <div class="w-9 h-9 sm:w-10 sm:h-10 rounded-xl bg-gradient-to-tr from-brand-600 to-emerald-400 flex items-center justify-center text-white shadow-md font-black text-lg">
              E
            </div>
            <span class="font-extrabold text-base sm:text-xl tracking-tight">
              منصة <span class="text-brand-600">الامتحانات</span>
            </span>
          </div>

          <!-- قائمة سطح المكتب -->
          <nav class="hidden md:flex items-center gap-6 text-sm font-semibold" id="main-nav-links"></nav>

          <!-- أزرار الإجراءات السريعة -->
          <div class="flex items-center gap-2" id="navbar-actions"></div>
        </div>
      </header>

      <!-- الحاوية الأساسية للصفحات -->
      <main id="app-root" class="w-full">
        <!-- المحتوى يُحقن ديناميكياً هنا -->
      </main>
    </div>

    <!-- الفوتر مع المدخل السري للأدمن عبر النقر على علامة © -->
    <footer class="mt-12 border-t border-slate-200 dark:border-slate-800 py-5 text-center text-xs text-slate-400">
      منصة الامتحانات الذكية المتطورة 
      <span onclick="navigate('#admin/login')" title="الإدارة" class="cursor-pointer hover:text-slate-600 dark:hover:text-slate-200 font-bold transition px-1">©</span> 
      <span id="current-year"></span> - نظام مؤمّن بمكافحة الغش
    </footer>
  </div>

  <!-- شريط الملاحة السفلي المخصص للموبايل والتابلت -->
  <nav id="mobile-bottom-nav" class="md:hidden fixed bottom-0 left-0 right-0 z-40 bg-white/95 dark:bg-slate-900/95 backdrop-blur border-t border-slate-200 dark:border-slate-800 flex justify-around items-center h-16 px-2 shadow-lg">
  </nav>

  <!-- حاوية النوافذ المنبثقة والشهادات -->
  <div id="modal-container"></div>

  <!-- ========================================================================= -->
  <!-- محرك النظام البرمجي الكامل (Native JavaScript) -->
  <!-- ========================================================================= -->
  <script>
    document.getElementById('current-year').innerText = new Date().getFullYear();

    // 1. قاعدة البيانات الافتراضية
    const INITIAL_DB = {
      users: [
        { uid: 'admin_1', email: 'admin@exam.com', displayName: 'المسؤول العام', role: 'admin', disabled: false, grade: 'الإدارة' },
        { uid: 'user_1', email: 'student@exam.com', displayName: 'أحمد محمود', role: 'user', disabled: false, grade: 'الثالث الثانوي' }
      ],
      exams: [
        {
          id: 'ex_1',
          title: 'اختبار اللغة العربية - النحو والبلاغة',
          subject: 'اللغة العربية',
          grade: 'الثالث الثانوي',
          description: 'اختبار شامل ومكثف يقيس الفهم العميق لقواعد النحو وفنون البلاغة العربية.',
          durationMinutes: 15,
          totalMarks: 30,
          passMarks: 15,
          isPublished: true,
          shuffleQuestions: true,
          showAnswersAfterExam: true,
          singleAttemptOnly: true,
          antiCheatEnabled: true, // تفعيل الرقابة ضد الغش
          questionCount: 3
        },
        {
          id: 'ex_2',
          title: 'اختبار الفيزياء - الكهربية والتيار المتردد',
          subject: 'الفيزياء',
          grade: 'الثالث الثانوي',
          description: 'تدريب تفاعلي مفتوح المحاولات على الدوائر الكهربية وقوانين فاراداي وكيرشوف.',
          durationMinutes: 20,
          totalMarks: 40,
          passMarks: 20,
          isPublished: true,
          shuffleQuestions: false,
          showAnswersAfterExam: true,
          singleAttemptOnly: false,
          antiCheatEnabled: false,
          questionCount: 2
        }
      ],
      questions: [
        {
          id: 'q_1',
          examId: 'ex_1',
          text: 'ما إعراب كلمة "حقاً" في جملة: (إنَّ هذا العلمَ لهو الفوزُ حقاً)؟',
          options: ['مفعول مطلق لفعل محذوف', 'حال منصوبة', 'تمييز منصوب وعلامة نصبه الفتحة', 'مفعول لأجله'],
          correctOptionIndex: 0,
          order: 1
        },
        {
          id: 'q_2',
          examId: 'ex_1',
          text: 'نوع الصورة البيانية في قول الشاعر: "وسلا مصرَ هل سلا القلبُ عنها"؟',
          options: ['استعارة تصريحية', 'استعارة مكنية في (سلا مصر)', 'تشبيه بليغ', 'مجاز مرسل'],
          correctOptionIndex: 1,
          order: 2
        },
        {
          id: 'q_3',
          examId: 'ex_1',
          text: 'حكم تأنيث الفعل مع الفاعل في جملة: (أشرقت الشمسُ)؟',
          options: ['واجب التأنيث', 'جائز التأنيث', 'يمتنع التأنيث', 'مستحب فقط'],
          correctOptionIndex: 1,
          order: 3
        },
        {
          id: 'q_4',
          examId: 'ex_2',
          text: 'وحدة قياس معامل الحث الذاتي (الهنري) تكافئ رياضياً:',
          options: ['فولت . ثانية / أمبير', 'أوم . ثانية', 'جول / أمبير²', 'جميع ما سبق صحيح ومكافئ'],
          correctOptionIndex: 3,
          order: 1
        },
        {
          id: 'q_5',
          examId: 'ex_2',
          text: 'عند مضاعفة سرعة دوران ملف الدينامو إلى الضعف، فإن القوة الدافعة الكهربية العظمى المستحثة:',
          options: ['تزداد إلى الضعف', 'تظل ثابتة لا تتغير', 'تزداد إلى أربعة أمثالها', 'تقل إلى النصف'],
          correctOptionIndex: 0,
          order: 2
        }
      ],
      attempts: []
    };

    // 2. محرك التخزين المحلي
    const DB = {
      init() {
        if (!localStorage.getItem('ex_users')) {
          localStorage.setItem('ex_users', JSON.stringify(INITIAL_DB.users));
          localStorage.setItem('ex_exams', JSON.stringify(INITIAL_DB.exams));
          localStorage.setItem('ex_questions', JSON.stringify(INITIAL_DB.questions));
          localStorage.setItem('ex_attempts', JSON.stringify(INITIAL_DB.attempts));
        }
      },
      get(table) {
        this.init();
        return JSON.parse(localStorage.getItem(`ex_${table}`) || '[]');
      },
      save(table, data) {
        localStorage.setItem(`ex_${table}`, JSON.stringify(data));
      },
      add(table, item) {
        const list = this.get(table);
        const newItem = { id: 'id_' + Date.now(), ...item };
        list.push(newItem);
        this.save(table, list);
        return newItem;
      },
      update(table, id, updates) {
        const list = this.get(table);
        const idx = list.findIndex(x => (x.id === id || x.uid === id));
        if (idx !== -1) {
          list[idx] = { ...list[idx], ...updates };
          this.save(table, list);
        }
      },
      delete(table, id) {
        const list = this.get(table).filter(x => (x.id !== id && x.uid !== id));
        this.save(table, list);
      }
    };
    DB.init();

    // 3. الحالة العامة ومكافحة الغش
    let currentUser = JSON.parse(localStorage.getItem('ex_session_user') || 'null');
    let examTimerInterval = null;
    let cheatWarningsCount = 0;
    const MAX_CHEAT_WARNINGS = 3;

    function showToast(message, isError = false) {
      const container = document.getElementById('toast-container');
      const toast = document.createElement('div');
      toast.className = `px-4 py-3 rounded-2xl shadow-xl flex items-center gap-2.5 text-white text-xs font-bold transition-all duration-300 transform -translate-y-2 pointer-events-auto ${isError ? 'bg-rose-600' : 'bg-emerald-600'}`;
      toast.innerHTML = `<span>${isError ? '⚠️' : '✅'}</span><span class="flex-1">${message}</span>`;
      container.appendChild(toast);
      setTimeout(() => toast.classList.remove('-translate-y-2'), 10);
      setTimeout(() => {
        toast.classList.add('opacity-0', '-translate-y-2');
        setTimeout(() => toast.remove(), 300);
      }, 3500);
    }

    function toggleDarkMode() {
      const isDark = document.documentElement.classList.toggle('dark');
      localStorage.setItem('ex_theme', isDark ? 'dark' : 'light');
      updateNavbar();
    }
    if (localStorage.getItem('ex_theme') === 'dark') {
      document.documentElement.classList.add('dark');
    }

    function navigate(hash) {
      window.location.hash = hash;
    }

    window.addEventListener('hashchange', renderCurrentRoute);

    // 🛡️ رصد محاولات الغش عند تغيير التبويب أو تصغير التطبيق
    document.addEventListener('visibilitychange', () => {
      const hash = window.location.hash || '';
      if (hash.startsWith('#exam/') && document.visibilityState === 'hidden' && examState.exam?.antiCheatEnabled) {
        cheatWarningsCount++;
        examState.cheatCount = cheatWarningsCount;
        
        if (cheatWarningsCount >= MAX_CHEAT_WARNINGS) {
          submitExamSession(true, "تم تسليم الامتحان إجبارياً بسبب تكرار مغادرة شاشة الاختبار (محاولة غش).");
        } else {
          showToast(`تحذير رسمي (${cheatWarningsCount}/${MAX_CHEAT_WARNINGS}): يُمنع مغادرة شاشة الامتحان! سيتم سحب الامتحان إذا تكرر الأمر.`, true);
        }
      }
    });

    // حماية إضافية: منع النسخ وتحديد النصوص والزر الأيمن أثناء الامتحان
    window.addEventListener('contextmenu', (e) => {
      if (window.location.hash.startsWith('#exam/')) e.preventDefault();
    });
    window.addEventListener('copy', (e) => {
      if (window.location.hash.startsWith('#exam/')) {
        e.preventDefault();
        showToast("النسخ محظور أثناء الاختبار!", true);
      }
    });

    // 4. تحديث شريط التنقل
    function updateNavbar() {
      const isDark = document.documentElement.classList.contains('dark');
      const navLinks = document.getElementById('main-nav-links');
      const actions = document.getElementById('navbar-actions');
      const bottomNav = document.getElementById('mobile-bottom-nav');
      const hash = window.location.hash || '#home';

      if (hash.startsWith('#exam/')) {
        bottomNav.style.display = 'none';
      } else {
        bottomNav.style.display = 'flex';
      }

      navLinks.innerHTML = `
        <button onclick="navigate('#home')" class="hover:text-brand-600 transition ${hash === '#home' ? 'text-brand-600 font-bold' : ''}">الرئيسية</button>
        <button onclick="navigate('#exams')" class="hover:text-brand-600 transition ${hash === '#exams' ? 'text-brand-600 font-bold' : ''}">الامتحانات</button>
        ${currentUser && currentUser.role !== 'admin' ? `<button onclick="navigate('#my-results')" class="hover:text-brand-600 transition ${hash === '#my-results' ? 'text-brand-600 font-bold' : ''}">نتائجي</button>` : ''}
        ${currentUser && currentUser.role === 'admin' ? `
          <button onclick="navigate('#admin/dashboard')" class="text-amber-600 dark:text-amber-400 flex items-center gap-1 font-bold">
            <span>لوحة الإدارة</span>
            <span class="text-[10px] bg-amber-100 dark:bg-amber-950/60 px-2 py-0.5 rounded-full">Admin</span>
          </button>
        ` : ''}
      `;

      actions.innerHTML = `
        <button onclick="toggleDarkMode()" class="p-2 sm:p-2.5 rounded-xl text-xs sm:text-sm bg-slate-100 dark:bg-slate-800">
          ${isDark ? '☀️' : '🌙'}
        </button>
        ${currentUser ? `
          <button onclick="navigate('#profile')" class="flex items-center gap-1.5 bg-slate-100 dark:bg-slate-800 py-1.5 px-2.5 sm:px-3 rounded-full hover:opacity-80">
            <div class="w-6 h-6 sm:w-7 sm:h-7 rounded-full bg-brand-600 text-white font-bold text-xs flex items-center justify-center">
              ${(currentUser.displayName || currentUser.email).charAt(0).toUpperCase()}
            </div>
            <span class="text-xs font-bold hidden sm:inline">${currentUser.displayName || currentUser.email}</span>
          </button>
          <button onclick="handleLogout()" class="text-xs text-rose-600 font-bold hover:bg-rose-50 dark:hover:bg-rose-950/30 p-1.5 sm:p-2 rounded-xl">خروج</button>
        ` : `
          <button onclick="navigate('#login')" class="text-xs font-bold text-brand-600 px-2.5 py-1.5 sm:px-3 sm:py-2 rounded-xl hover:bg-brand-50">دخول</button>
          <button onclick="navigate('#register')" class="text-xs font-bold bg-brand-600 text-white px-3 py-1.5 sm:px-3.5 sm:py-2 rounded-xl shadow hover:bg-brand-700">حساب جديد</button>
        `}
      `;

      bottomNav.innerHTML = `
        <button onclick="navigate('#home')" class="flex flex-col items-center gap-1 py-1 px-3 ${hash === '#home' ? 'text-brand-600 font-bold' : 'text-slate-500'}">
          <span class="text-lg">🏠</span>
          <span class="text-[10px]">الرئيسية</span>
        </button>
        <button onclick="navigate('#exams')" class="flex flex-col items-center gap-1 py-1 px-3 ${hash === '#exams' ? 'text-brand-600 font-bold' : 'text-slate-500'}">
          <span class="text-lg">📝</span>
          <span class="text-[10px]">الامتحانات</span>
        </button>
        <button onclick="navigate('${currentUser ? '#my-results' : '#login'}')" class="flex flex-col items-center gap-1 py-1 px-3 ${hash === '#my-results' ? 'text-brand-600 font-bold' : 'text-slate-500'}">
          <span class="text-lg">🏆</span>
          <span class="text-[10px]">نتائجي</span>
        </button>
        <button onclick="navigate('${currentUser ? '#profile' : '#login'}')" class="flex flex-col items-center gap-1 py-1 px-3 ${hash === '#profile' || hash === '#login' ? 'text-brand-600 font-bold' : 'text-slate-500'}">
          <span class="text-lg">👤</span>
          <span class="text-[10px]">${currentUser ? 'حسابي' : 'دخول'}</span>
        </button>
      `;
    }

    function handleLogout() {
      currentUser = null;
      localStorage.removeItem('ex_session_user');
      showToast("تم تسجيل الخروج");
      updateNavbar();
      navigate('#home');
    }

    // 5. موجه الصفحات
    function renderCurrentRoute() {
      if (examTimerInterval) {
        clearInterval(examTimerInterval);
        examTimerInterval = null;
      }
      cheatWarningsCount = 0;
      updateNavbar();
      const root = document.getElementById('app-root');
      const hash = window.location.hash || '#home';

      if (hash === '#home') renderHome(root);
      else if (hash === '#login') renderAuth(root, false);
      else if (hash === '#register') renderAuth(root, true);
      else if (hash === '#exams') renderExamsList(root);
      else if (hash.startsWith('#exam/')) renderExamSession(root, hash.split('#exam/')[1]);
      else if (hash.startsWith('#result/')) renderResult(root, hash.split('#result/')[1]);
      else if (hash === '#my-results') renderMyResults(root);
      else if (hash === '#profile') renderProfile(root);
      else if (hash === '#admin/login') renderAdminLogin(root);
      else if (hash === '#admin/dashboard') renderAdminDashboard(root);
      else if (hash === '#admin/exams') renderAdminExams(root);
      else if (hash.startsWith('#admin/questions/')) renderAdminQuestions(root, hash.split('#admin/questions/')[1]);
      else if (hash === '#admin/users') renderAdminUsers(root);
      else if (hash === '#admin/results') renderAdminResults(root);
      else renderHome(root);

      window.scrollTo(0, 0);
    }

    // --- الصفحة الرئيسية ---
    function renderHome(root) {
      root.innerHTML = `
        <div class="py-8 sm:py-14 px-4 max-w-6xl mx-auto space-y-10 sm:space-y-16">
          <div class="text-center space-y-4 sm:space-y-6 max-w-3xl mx-auto">
            <div class="inline-block bg-brand-100 dark:bg-brand-950/60 text-brand-700 dark:text-brand-300 px-3.5 py-1 rounded-full text-[11px] sm:text-xs font-black">
              منصة الاختبارات الذكية - مراقبة ضد الغش وشهادات تقدير 🛡️
            </div>
            <h1 class="text-3xl sm:text-6xl font-black text-slate-900 dark:text-white leading-tight">
              اختبر معلوماتك <span class="text-brand-600">بدقة وسرعة</span> واحصل على شهادتك
            </h1>
            <p class="text-xs sm:text-base text-slate-500 dark:text-slate-400 max-w-2xl mx-auto leading-relaxed">
              مؤقت تنازلي ذكي، رصد لمغادرة الشاشة لمنع الغش، حفظ فوري للإجابات، وإصدار شهادات تفوق للمجتازين.
            </p>
            <div class="flex flex-col sm:flex-row items-center justify-center gap-3 pt-2">
              <button onclick="navigate(currentUser ? '#exams' : '#register')" class="w-full sm:w-auto px-8 py-3.5 bg-brand-600 hover:bg-brand-700 text-white font-bold rounded-2xl shadow-lg transition text-sm">
                ابدأ الامتحانات الآن
              </button>
              <button onclick="navigate('#exams')" class="w-full sm:w-auto px-8 py-3.5 bg-slate-200 dark:bg-slate-800 hover:bg-slate-300 dark:hover:bg-slate-700 font-bold rounded-2xl transition text-xs sm:text-sm">
                تصفح قائمة المواد
              </button>
            </div>
          </div>

          <div class="grid grid-cols-1 sm:grid-cols-3 gap-4 sm:gap-6">
            <div class="p-5 sm:p-6 bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-3xl shadow-sm space-y-2">
              <div class="text-2xl sm:text-3xl">🛡️</div>
              <h3 class="font-bold text-sm sm:text-base">نظام مكافحة الغش الذكي</h3>
              <p class="text-xs text-slate-500 leading-relaxed">رصد تغيير التبويب لمنع البحث عن الإجابات، وحماية سرية ونزاهة الاختبارات.</p>
            </div>
            <div class="p-5 sm:p-6 bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-3xl shadow-sm space-y-2">
              <div class="text-2xl sm:text-3xl">🎓</div>
              <h3 class="font-bold text-sm sm:text-base">شهادات تفوق فورية</h3>
              <p class="text-xs text-slate-500 leading-relaxed">توليد شهادة إتمام وتفوق معتمدة قابلة للطباعة والحفظ كـ PDF فور اجتياز الامتحان.</p>
            </div>
            <div class="p-5 sm:p-6 bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-3xl shadow-sm space-y-2">
              <div class="text-2xl sm:text-3xl">🚩</div>
              <h3 class="font-bold text-sm sm:text-base">تمييز الأسئلة للمراجعة</h3>
              <p class="text-xs text-slate-500 leading-relaxed">ضع علامة على الأسئلة المعقدة للعودة إليها وتعديلها بسهولة قبل تسليم الورقة.</p>
            </div>
          </div>
        </div>
      `;
    }

    // --- صفحة الدخول والتسجيل ---
    function renderAuth(root, isRegister) {
      root.innerHTML = `
        <div class="min-h-[70vh] flex items-center justify-center p-4">
          <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-3xl p-6 sm:p-8 max-w-md w-full shadow-xl">
            <h2 class="text-xl sm:text-2xl font-black mb-1 text-center">${isRegister ? 'إنشاء حساب طالب جديد' : 'تسجيل دخول الطالب'}</h2>
            <p class="text-xs text-slate-400 text-center mb-6">أدخل بياناتك للمتابعة</p>

            <form id="auth-form" class="space-y-3.5">
              ${isRegister ? `

        const users = DB.get('users');

        if (isRegister) {
          const name = document.getElementById('auth-name').value.trim();
          const grade = document.getElementById('auth-grade').value;
          if (users.find(u => u.email.toLowerCase() === email.toLowerCase())) {
            showToast("هذا البريد مسجل مسبقاً!", true);
            return;
          }
          const newUser = { uid: 'u_' + Date.now(), email, displayName: name, role: 'user', disabled: false, grade };

          currentUser = newUser;
          localStorage.setItem('ex_session_user', JSON.stringify(newUser));

        } else {
          let user = users.find(u => u.email.toLowerCase() === email.toLowerCase());

          currentUser = user;
          localStorage.setItem('ex_session_user', JSON.stringify(user));
          showToast("تم تسجيل الدخول بنجاح");

        updateNavbar();
        navigate('#exams');
      };

    // --- نافذة التأكيد قبل بدء الامتحان ---

            <div class="bg-slate-50 dark:bg-slate-800/50 p-3 rounded-2xl text-xs space-y-1 text-slate-600 dark:text-slate-300">

    function confirmStartExam(examId) {
      document.getElementById('modal-container').innerHTML = '';
      navigate(`#exam/${examId}`);
    }

    // --- غرفة الاختبار مع ميزة Flag للمراجعة وعداد مخالفات الغش ---
    let examState = { exam: null, questions: [], currentIndex: 0, answers: {}, flagged: {}, timeLeft: 0, cheatCount: 0 };

    function renderExamSession(root, examId) {
      if (!currentUser) { navigate('#login'); return; }

      const exam = DB.get('exams').find(e => e.id === examId);
      if (!exam) { navigate('#exams'); return; }

      let questions = DB.get('questions').filter(q => q.examId === examId);
      if (exam.shuffleQuestions) {
        questions = [...questions].sort(() => Math.random() - 0.5);
      }

      const sessionKey = `active_exam_${examId}_${currentUser.uid}`;
      const saved = localStorage.getItem(sessionKey);
      
      examState.exam = exam;
      examState.questions = questions;
      examState.currentIndex = 0;
      examState.answers = saved ? JSON.parse(saved).answers : {};
      examState.flagged = saved ? (JSON.parse(saved).flagged || {}) : {};
      examState.timeLeft = saved ? JSON.parse(saved).timeLeft : (exam.durationMinutes * 60);
      examState.cheatCount = saved ? (JSON.parse(saved).cheatCount || 0) : 0;
      cheatWarningsCount = examState.cheatCount;

      renderExamUI(root);

      examTimerInterval = setInterval(() => {
        examState.timeLeft--;
        localStorage.setItem(sessionKey, JSON.stringify({ 
          answers: examState.answers, 
          flagged: examState.flagged,
          timeLeft: examState.timeLeft,
          cheatCount: examState.cheatCount
        }));

        const mins = Math.floor(examState.timeLeft / 60);
        const secs = examState.timeLeft % 60;
        const timerElem = document.getElementById('session-timer-text');
        if (timerElem) {
          timerElem.innerText = `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
        }

        if (examState.timeLeft <= 0) {
          clearInterval(examTimerInterval);
          submitExamSession(true, "انتهى الوقت المحدد للاختبار.");
        }
      }, 1000);
    }

    function renderExamUI(root) {
      const { exam, questions, currentIndex, answers, flagged, timeLeft } = examState;
      if (!questions.length) {
        root.innerHTML = `<div class="py-24 text-center">لا توجد أسئلة مضافة في هذا الامتحان بعد.</div>`;
        return;
      }

      const q = questions[currentIndex];
      const mins = Math.floor(timeLeft / 60);
      const secs = timeLeft % 60;
      const isFlagged = !!flagged[q.id];

      root.innerHTML = `
        <div class="max-w-4xl mx-auto px-3 sm:px-4 py-3 sm:py-6 space-y-4">
          <!-- شريط علوي -->
          <div class="bg-white dark:bg-slate-900 rounded-2xl sm:rounded-3xl p-3 sm:p-5 border border-slate-200 dark:border-slate-800 flex justify-between items-center shadow-sm">
            <div>
              <div class="flex items-center gap-2">
                <span class="text-[10px] font-bold text-brand-600">${exam.subject}</span>
                ${exam.antiCheatEnabled ? `<span class="text-[9px] bg-red-100 text-red-600 px-1.5 py-0.5 rounded font-bold">🛡️ مراقبة نشطة</span>` : ''}
              </div>
              <h2 class="font-extrabold text-xs sm:text-base line-clamp-1">${exam.title}</h2>
            </div>
            <div class="flex items-center gap-2 sm:gap-3">
              <div class="font-mono text-xs sm:text-sm font-black px-2.5 py-1.5 rounded-xl bg-slate-100 dark:bg-slate-800">
                ⏰ <span id="session-timer-text">${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}</span>
              </div>
              <button onclick="confirmSubmitExam()" class="px-3 sm:px-4 py-1.5 sm:py-2 bg-brand-600 hover:bg-brand-700 text-white rounded-xl text-xs font-bold shadow">
                تسليم
              </button>
            </div>
          </div>

          <!-- شريط الأسئلة مع دعم إشارة التمييز 🚩 -->
          <div class="flex items-center gap-1.5 overflow-x-auto pb-1 no-scrollbar py-1">
            ${questions.map((item, idx) => {
              const itemAnswered = answers[item.id] !== undefined;
              const itemFlagged = !!flagged[item.id];
              let btnStyle = 'bg-white dark:bg-slate-800 text-slate-600 dark:text-slate-300 border border-slate-200 dark:border-slate-700';
              
              if (itemFlagged) {
                btnStyle = 'bg-amber-500 text-white border-amber-500';
              } else if (itemAnswered) {
                btnStyle = 'bg-brand-600 text-white';
              }

              return `
                <button
                  onclick="goToQuestion(${idx})"
                  class="flex-shrink-0 w-9 h-9 sm:w-10 sm:h-10 rounded-xl font-bold text-xs flex items-center justify-center transition-all relative ${
                    currentIndex === idx ? 'ring-2 ring-brand-500 scale-105 font-black' : ''
                  } ${btnStyle}"
                >
                  ${idx + 1}
                  ${itemFlagged ? `<span class="absolute -top-1 -right-1 text-[10px]">🚩</span>` : ''}
                </button>
              `;
            }).join('')}
          </div>

          <!-- كارت السؤال -->
          <div class="bg-white dark:bg-slate-900 rounded-2xl sm:rounded-3xl p-5 sm:p-8 border border-slate-200 dark:border-slate-800 space-y-5 shadow-sm">
            <div class="flex justify-between items-center text-xs font-bold text-slate-400">
              <span>سؤال ${currentIndex + 1} من ${questions.length}</span>
              
              <!-- 🚩 زر تمييز السؤال للمراجعة -->
              <button
                onclick="toggleFlagQuestion('${q.id}')"
                class="flex items-center gap-1 px-3 py-1.5 rounded-xl border text-xs transition ${
                  isFlagged ? 'border-amber-500 bg-amber-50 text-amber-700 dark:bg-amber-950/40 dark:text-amber-300 font-bold' : 'border-slate-200 hover:bg-slate-50 dark:border-slate-700'
                }"
              >
                <span>${isFlagged ? '🚩 مميز للمراجعة' : '🏳️ تمييز للمراجعة'}</span>
              </button>
            </div>

            <h3 class="font-bold text-base sm:text-xl leading-relaxed text-slate-900 dark:text-white">${q.text}</h3>

            <!-- الخيارات -->
            <div class="space-y-2.5 sm:space-y-3">
              ${q.options.map((opt, oIdx) => {
                const isSelected = answers[q.id] === oIdx;
                return `
                  <div
                    onclick="selectExamOption('${q.id}', ${oIdx})"
                    class="cursor-pointer p-4 rounded-2xl border-2 transition active:scale-[0.99] flex items-center gap-3 text-xs sm:text-sm font-semibold ${
                      isSelected ? 'border-brand-600 bg-brand-50/70 dark:bg-brand-950/40 text-brand-900 dark:text-brand-200 shadow-sm' : 'border-slate-200 dark:border-slate-800 hover:border-slate-300'
                    }"
                  >
                    <div class="w-6 h-6 rounded-full flex-shrink-0 flex items-center justify-center text-xs font-bold border ${isSelected ? 'bg-brand-600 text-white border-brand-600' : 'border-slate-400'}">
                      ${['أ', 'ب', 'ج', 'د'][oIdx] || oIdx + 1}
                    </div>
                    <span class="leading-relaxed flex-1">${opt}</span>
                  </div>
                `;
              }).join('')}
            </div>

            <!-- أزرار التنقل -->
            <div class="flex justify-between pt-4 border-t border-slate-100 dark:border-slate-800">
              <button ${currentIndex === 0 ? 'disabled' : ''} onclick="changeQuestion(-1)" class="px-5 py-2.5 text-xs font-bold border rounded-xl disabled:opacity-30">السابق</button>
              ${currentIndex < questions.length - 1 ? `
                <button onclick="changeQuestion(1)" class="px-6 py-2.5 text-xs font-bold bg-slate-900 text-white dark:bg-white dark:text-slate-900 rounded-xl shadow">التالي</button>
              ` : `
                <button onclick="confirmSubmitExam()" class="px-6 py-2.5 text-xs font-bold bg-brand-600 text-white rounded-xl shadow">مراجعة وتسليم</button>
              `}
            </div>
          </div>
        </div>
      `;
    }

    function toggleFlagQuestion(qId) {
      examState.flagged[qId] = !examState.flagged[qId];
      renderExamUI(document.getElementById('app-root'));
    }

    function selectExamOption(qId, oIdx) {
      examState.answers[qId] = oIdx;
      const sessionKey = `active_exam_${examState.exam.id}_${currentUser.uid}`;
      localStorage.setItem(sessionKey, JSON.stringify({ 
        answers: examState.answers, 
        flagged: examState.flagged,
        timeLeft: examState.timeLeft,
        cheatCount: examState.cheatCount 
      }));
      renderExamUI(document.getElementById('app-root'));
    }

    function changeQuestion(delta) {
      examState.currentIndex += delta;
      renderExamUI(document.getElementById('app-root'));
    }

    function goToQuestion(idx) {
      examState.currentIndex = idx;
      renderExamUI(document.getElementById('app-root'));
    }

    function confirmSubmitExam() {
      const answeredCount = Object.keys(examState.answers).length;
      const total = examState.questions.length;

    function submitExamSession(isTimeout = false, reason = "") {
      document.getElementById('modal-container').innerHTML = '';
      if (examTimerInterval) clearInterval(examTimerInterval);

      const { exam, questions, answers, cheatCount } = examState;
      let correctCount = 0;
      const markPerQ = exam.totalMarks / (questions.length || 1);

      questions.forEach(q => {
        if (answers[q.id] === q.correctOptionIndex) correctCount++;
      });

      const score = Math.round(correctCount * markPerQ);
      const percentage = Math.round((score / exam.totalMarks) * 100);
      const passed = score >= exam.passMarks;

      const attempt = DB.add('attempts', {
        examId: exam.id,
        examTitle: exam.title,
        subject: exam.subject,
        userId: currentUser.uid,
        userName: currentUser.displayName,
        userEmail: currentUser.email,
        answers,
        score,
        totalMarks: exam.totalMarks,
        percentage,
        passed,
        correctCount,
        wrongCount: questions.length - correctCount,
        cheatViolations: cheatCount || 0, // تدوين عدد مخالفات الغش
        submittedAt: new Date().toISOString()
      });

      localStorage.removeItem(`active_exam_${exam.id}_${currentUser.uid}`);
      showToast(reason || (isTimeout ? "تم تسليم الامتحان تلقائياً" : "تم تسليم الامتحان بنجاح!"));
      navigate(`#result/${attempt.id}`);
    }

          <div class="p-3.5 sm:p-4 bg-white dark:bg-slate-900 rounded-2xl border shadow-sm">
            <span class="text-[10px] text-slate-400 block mb-1">متوسط الدرجات</span>
            <span class="text-xl sm:text-2xl font-black text-purple-600">${avg}%</span>
          </div>
        </div>
      `);
    }

    function renderAdminExams(root) {
      const exams = DB.get('exams');

      root.innerHTML = renderAdminLayout('exams', `
        <div class="flex justify-between items-center gap-2">
          <h2 class="text-xl sm:text-2xl font-black">إدارة الامتحانات</h2>
          <button onclick="openExamModal()" class="px-3 sm:px-4 py-2 bg-brand-600 text-white rounded-xl text-xs font-bold shadow">
            + إنشاء امتحان جديد
          </button>
        </div>

        <div class="space-y-3">
          ${exams.map(exam => `
            <div class="bg-white dark:bg-slate-900 p-4 rounded-2xl border flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3 shadow-sm">
              <div class="space-y-1">
                <div class="flex flex-wrap items-center gap-1.5 mb-1">
                  <span class="text-[10px] bg-slate-100 dark:bg-slate-800 px-2 py-0.5 rounded font-bold">${exam.subject}</span>
                  <span class="text-xs text-slate-400">${exam.grade}</span>
                  <span class="text-[10px] px-2 py-0.5 rounded-full font-bold ${exam.isPublished ? 'bg-emerald-100 text-emerald-700' : 'bg-slate-200 text-slate-600'}">
                    ${exam.isPublished ? 'منشور' : 'مسودة'}
                  </span>
                  <span class="text-[10px] px-2 py-0.5 rounded-full font-bold ${exam.singleAttemptOnly ? 'bg-amber-100 text-amber-800' : 'bg-blue-100 text-blue-800'}">
                    ${exam.singleAttemptOnly ? 'محاولة واحدة' : 'مفتوح'}
                  </span>
                  ${exam.antiCheatEnabled ? `<span class="text-[10px] px-2 py-0.5 rounded-full font-bold bg-rose-100 text-rose-800">🛡️ ضد الغش</span>` : ''}
                </div>
                <h4 class="font-extrabold text-sm">${exam.title}</h4>
                <p class="text-[11px] text-slate-400">المدة: ${exam.durationMinutes} د | الدرجة: ${exam.totalMarks}</p>
              </div>

              <div class="flex items-center gap-1.5 flex-wrap w-full sm:w-auto">
                <button onclick="navigate('#admin/questions/${exam.id}')" class="px-2.5 py-1.5 bg-blue-50 text-blue-600 dark:bg-blue-950/40 rounded-xl text-xs font-bold">
                  الأسئلة (${DB.get('questions').filter(q => q.examId === exam.id).length})
                </button>
                <button onclick="toggleExamPublish('${exam.id}')" class="px-2.5 py-1.5 bg-slate-100 dark:bg-slate-800 rounded-xl text-xs font-bold">
                  ${exam.isPublished ? 'إخفاء' : 'نشر'}
                </button>
                <button onclick="deleteExam('${exam.id}')" class="px-2.5 py-1.5 bg-rose-50 text-rose-600 rounded-xl text-xs font-bold">
                  حذف
                </button>
              </div>
            </div>
          `).join('')}
        </div>
      `);
    }

    function toggleExamPublish(id) {
      const exam = DB.get('exams').find(e => e.id === id);
      if (exam) {
        DB.update('exams', id, { isPublished: !exam.isPublished });
        renderAdminExams(document.getElementById('app-root'));
      }
    }

    function deleteExam(id) {
      if (!confirm("هل أنت متأكد من حذف هذا الامتحان؟")) return;
      DB.delete('exams', id);
      showToast("تم حذف الامتحان");
      renderAdminExams(document.getElementById('app-root'));
    }

    function openExamModal() {
      document.getElementById('modal-container').innerHTML = `
        <div class="fixed inset-0 z-50 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4">
          <form id="new-exam-form" class="bg-white dark:bg-slate-900 rounded-3xl max-w-lg w-full p-5 sm:p-6 space-y-4 shadow-2xl border max-h-[90vh] overflow-y-auto">
            <h3 class="font-bold text-base">إنشاء امتحان جديد</h3>
            <div class="grid sm:grid-cols-2 gap-3 text-xs">
              <div>
                <label class="block font-bold mb-1">اسم الامتحان</label>
                <input id="ex-title" required class="w-full p-2 border rounded-xl dark:bg-slate-950" />
              </div>
              <div>
                <label class="block font-bold mb-1">المادة</label>
                <input id="ex-subject" required class="w-full p-2 border rounded-xl dark:bg-slate-950" />
              </div>
              <div>
                <label class="block font-bold mb-1">المدة (دقائق)</label>
                <input id="ex-duration" type="number" required value="20" class="w-full p-2 border rounded-xl dark:bg-slate-950" />
              </div>
              <div>
                <label class="block font-bold mb-1">الدرجة الكلية</label>
                <input id="ex-marks" type="number" required value="40" class="w-full p-2 border rounded-xl dark:bg-slate-950" />
              </div>
            </div>

            <div class="space-y-2 pt-2 border-t text-xs font-bold">
              <label class="flex items-center gap-2 cursor-pointer p-2 bg-rose-50 dark:bg-rose-950/30 rounded-xl text-rose-900 dark:text-rose-300">
                <input id="ex-anti-cheat" type="checkbox" checked class="w-4 h-4 text-rose-600 rounded" />
                <span>🛡️ تفعيل نظام مكافحة الغش (رصد مغادرة الشاشة والتحذيرات)</span>
              </label>
              <label class="flex items-center gap-2 cursor-pointer p-2 bg-amber-50 dark:bg-amber-950/30 rounded-xl text-amber-900 dark:text-amber-300">
                <input id="ex-single-attempt" type="checkbox" checked class="w-4 h-4 text-brand-600 rounded" />
                <span>السماح بمحاولة واحدة فقط لكل طالب (منع إعادة الامتحان)</span>
              </label>
              <label class="flex items-center gap-2 cursor-pointer">
                <input id="ex-shuffle" type="checkbox" checked class="w-4 h-4 text-brand-600 rounded" />
                <span>ترتيب الأسئلة عشوائياً للطلاب</span>
              </label>
              <label class="flex items-center gap-2 cursor-pointer">
                <input id="ex-show-ans" type="checkbox" checked class="w-4 h-4 text-brand-600 rounded" />
                <span>إظهار الإجابات النموذجية بعد النتيجة</span>
              </label>
              <label class="flex items-center gap-2 cursor-pointer">
                <input id="ex-publish" type="checkbox" checked class="w-4 h-4 text-brand-600 rounded" />
                <span>نشر الامتحان وجعله متاحاً فوراً للطلاب</span>
              </label>
            </div>

            <div class="flex justify-end gap-2 pt-2">
              <button type="button" onclick="document.getElementById('modal-container').innerHTML=''" class="px-4 py-2 text-xs font-bold border rounded-xl">إلغاء</button>
              <button type="submit" class="px-5 py-2 text-xs font-bold bg-brand-600 text-white rounded-xl shadow">حفظ الامتحان</button>
            </div>
          </form>
        </div>
      `;

      document.getElementById('new-exam-form').onsubmit = function(e) {
        e.preventDefault();
        DB.add('exams', {
          title: document.getElementById('ex-title').value,
          subject: document.getElementById('ex-subject').value,
          grade: 'الثالث الثانوي',
          description: 'امتحان قياسي تقييمي شامل.',
          durationMinutes: Number(document.getElementById('ex-duration').value),
          totalMarks: Number(document.getElementById('ex-marks').value),
          passMarks: Number(document.getElementById('ex-marks').value) / 2,
          isPublished: document.getElementById('ex-publish').checked,
          shuffleQuestions: document.getElementById('ex-shuffle').checked,
          showAnswersAfterExam: document.getElementById('ex-show-ans').checked,
          singleAttemptOnly: document.getElementById('ex-single-attempt').checked,
          antiCheatEnabled: document.getElementById('ex-anti-cheat').checked,
          questionCount: 0
        });
        document.getElementById('modal-container').innerHTML = '';
        showToast("تم إنشاء الامتحان بنجاح!");
        renderAdminExams(document.getElementById('app-root'));
      };
    }

    function renderAdminQuestions(root, examId) {
      const exam = DB.get('exams').find(e => e.id === examId);
      const questions = DB.get('questions').filter(q => q.examId === examId);

      root.innerHTML = renderAdminLayout('exams', `
        <div class="flex justify-between items-center gap-2">
          <div>
            <button onclick="navigate('#admin/exams')" class="text-xs text-slate-400 hover:underline">← العودة للامتحانات</button>
            <h2 class="text-lg sm:text-xl font-black mt-0.5">أسئلة: ${exam ? exam.title : ''}</h2>
          </div>
          <button onclick="openQuestionModal('${examId}')" class="px-3 sm:px-4 py-2 bg-brand-600 text-white rounded-xl text-xs font-bold shadow">
            + إضافة سؤال
          </button>
        </div>

        <div class="space-y-3">
          ${questions.map((q, idx) => `
            <div class="bg-white dark:bg-slate-900 p-4 rounded-2xl border space-y-3 shadow-sm">
              <div class="flex justify-between items-start">
                <h4 class="font-bold text-xs"><span class="text-brand-600 ml-1">#${idx + 1}</span> ${q.text}</h4>
                <button onclick="deleteQuestion('${q.id}', '${examId}')" class="text-xs text-rose-600 font-bold hover:underline">حذف</button>
              </div>

              <div class="grid grid-cols-1 sm:grid-cols-2 gap-2 text-xs">
                ${q.options.map((opt, oIdx) => `
                  <div class="p-2 rounded-xl border ${q.correctOptionIndex === oIdx ? 'bg-emerald-50 border-emerald-500 font-bold text-emerald-800' : 'border-slate-200 dark:border-slate-800'}">
                    ${opt} ${q.correctOptionIndex === oIdx ? '✓' : ''}
                  </div>
                `).join('')}
              </div>
            </div>
          `).join('')}
        </div>
      `);
    }

    function deleteQuestion(qId, examId) {
      if (!confirm("حذف هذا السؤال؟")) return;
      DB.delete('questions', qId);
      const questionsCount = DB.get('questions').filter(q => q.examId === examId).length;
      DB.update('exams', examId, { questionCount: questionsCount });
      showToast("تم حذف السؤال");
      renderAdminQuestions(document.getElementById('app-root'), examId);
    }

    function openQuestionModal(examId) {
      document.getElementById('modal-container').innerHTML = `
        <div class="fixed inset-0 z-50 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4">
          <form id="new-q-form" class="bg-white dark:bg-slate-900 rounded-3xl max-w-lg w-full p-5 sm:p-6 space-y-3 shadow-2xl border max-h-[90vh] overflow-y-auto">
            <h3 class="font-bold text-sm">إضافة سؤال اختيار من متعدد</h3>
            <div>
              <label class="block text-xs font-bold mb-1">نص السؤال</label>
              <textarea id="q-text" required class="w-full p-2.5 border rounded-xl dark:bg-slate-950 text-xs h-20" placeholder="اكتب نص السؤال هنا..."></textarea>
            </div>

            <div class="space-y-2">
              <label class="block text-xs font-bold">الخيارات الأربعة (حدد الإجابة الصحيحة):</label>
              ${[0, 1, 2, 3].map(i => `
                <div class="flex items-center gap-2">
                  <input type="radio" name="correct_opt" value="${i}" ${i === 0 ? 'checked' : ''} class="w-4 h-4 text-brand-600 flex-shrink-0" />
                  <input id="q-opt-${i}" required class="flex-1 p-2 border rounded-xl dark:bg-slate-950 text-xs" placeholder="الخيار ${i + 1}" />
                </div>
              `).join('')}
            </div>

            <div class="flex justify-end gap-2 pt-2">
              <button type="button" onclick="document.getElementById('modal-container').innerHTML=''" class="px-4 py-2 text-xs font-bold border rounded-xl">إلغاء</button>
              <button type="submit" class="px-5 py-2 text-xs font-bold bg-brand-600 text-white rounded-xl shadow">حفظ السؤال</button>
            </div>
          </form>
        </div>
      `;

      document.getElementById('new-q-form').onsubmit = function(e) {
        e.preventDefault();
        const selectedRadio = document.querySelector('input[name="correct_opt"]:checked');
        const correctIdx = Number(selectedRadio.value);

        DB.add('questions', {
          examId,
          text: document.getElementById('q-text').value,
          options: [
            document.getElementById('q-opt-0').value,
            document.getElementById('q-opt-1').value,
            document.getElementById('q-opt-2').value,
            document.getElementById('q-opt-3').value
          ],
          correctOptionIndex: correctIdx
        });

        const questionsCount = DB.get('questions').filter(q => q.examId === examId).length;
        DB.update('exams', examId, { questionCount: questionsCount });

        document.getElementById('modal-container').innerHTML = '';
        showToast("تمت إضافة السؤال بنجاح!");
        renderAdminQuestions(document.getElementById('app-root'), examId);
      };
    }

    // --- إدارة الطلاب: تفعيل/تعطيل وحذف ---
    function renderAdminUsers(root) {
      const users = DB.get('users');

      root.innerHTML = renderAdminLayout('users', `
        <div class="flex justify-between items-center">
          <h2 class="text-xl sm:text-2xl font-black">إدارة الطلاب</h2>
          <span class="text-xs text-slate-400">إجمالي: ${users.length}</span>
        </div>

        <div class="bg-white dark:bg-slate-900 rounded-3xl border border-slate-200 dark:border-slate-800 overflow-x-auto shadow-sm">
          <table class="w-full text-right text-xs min-w-[500px]">
            <thead class="bg-slate-50 dark:bg-slate-800 border-b text-slate-400 font-bold">
              <tr>
                <th class="p-3">المستخدم</th>
                <th class="p-3">الصف</th>
                <th class="p-3">الدور</th>
                <th class="p-3">الحالة</th>
                <th class="p-3 text-center">الإجراءات</th>
              </tr>
            </thead>
            <tbody class="divide-y divide-slate-100 dark:divide-slate-800">
              ${users.map(u => `
                <tr class="hover:bg-slate-50/50 dark:hover:bg-slate-800/30 transition">
                  <td class="p-3">
                    <span class="font-bold block text-slate-800 dark:text-slate-100">${u.displayName || 'بدون اسم'}</span>
                    <span class="text-slate-400 dir-ltr text-[10px] block">${u.email}</span>
                  </td>
                  <td class="p-3 text-slate-500">${u.grade || '-'}</td>
                  <td class="p-3 font-bold">
                    <span class="px-2 py-0.5 rounded-full text-[10px] ${u.role === 'admin' ? 'bg-amber-100 text-amber-800 dark:bg-amber-950/60' : 'bg-slate-100 dark:bg-slate-800'}">
                      ${u.role}
                    </span>
                  </td>
                  <td class="p-3">
                    <span class="px-2 py-0.5 rounded-full text-[10px] font-bold ${u.disabled ? 'bg-rose-100 text-rose-700' : 'bg-emerald-100 text-emerald-700'}">
                      ${u.disabled ? 'معطل' : 'نشط'}
                    </span>
                  </td>
                  <td class="p-3 text-center">
                    <div class="flex items-center justify-center gap-1.5">
                      <button onclick="toggleUserDisable('${u.uid}')" class="px-2.5 py-1 border rounded-xl text-[10px] font-bold">
                        ${u.disabled ? 'تفعيل' : 'تعطيل'}
                      </button>
                      ${u.role !== 'admin' ? `
                        <button onclick="deleteStudent('${u.uid}', '${u.displayName || u.email}')" class="px-2.5 py-1 bg-rose-50 hover:bg-rose-100 text-rose-600 dark:bg-rose-950/50 rounded-xl text-[10px] font-bold transition">
                          🗑️ حذف
                        </button>
                      ` : ''}
                    </div>
                  </td>
                </tr>
              `).join('')}
            </tbody>
          </table>
        </div>
      `);
    }

    function toggleUserDisable(uid) {
      const user = DB.get('users').find(u => u.uid === uid);
      if (user) {
        DB.update('users', uid, { disabled: !user.disabled });
        showToast(user.disabled ? "تم تنشيط الحساب" : "تم تعطيل الحساب");
        renderAdminUsers(document.getElementById('app-root'));
      }
    }

    function deleteStudent(uid, studentName) {
      if (!confirm(`تحذير: هل أنت متأكد من حذف الطالب (${studentName}) نهائياً؟\nسيتم مسح كافة درجاته ومحاولاته من النظام.`)) {
        return;
      }
      DB.delete('users', uid);
      const attempts = DB.get('attempts').filter(a => a.userId !== uid);
      DB.save('attempts', attempts);

      showToast(`تم حذف الطالب (${studentName}) وسجلاته بنجاح`);
      renderAdminUsers(document.getElementById('app-root'));
    }

    // --- جدول النتائج مع ميزة تصدير Excel / CSV ---
    function renderAdminResults(root) {
      const attempts = DB.get('attempts');

      root.innerHTML = renderAdminLayout('results', `
        <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3">
          <div>
            <h2 class="text-xl sm:text-2xl font-black">سجل كافة نتائج الطلاب</h2>
            <span class="text-xs text-slate-400">إجمالي المحاولات المسجلة: ${attempts.length}</span>
          </div>
          <!-- 📊 زر تصدير النتائج لـ Excel -->
          <button onclick="exportResultsToCSV()" class="px-4 py-2 bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl text-xs font-bold shadow flex items-center gap-1.5 transition">
            <span>📥 تصدير كشف الدرجات (Excel/CSV)</span>
          </button>
        </div>

        <div class="bg-white dark:bg-slate-900 rounded-3xl border overflow-x-auto shadow-sm">
          <table class="w-full text-right text-xs min-w-[550px]">
            <thead class="bg-slate-50 dark:bg-slate-800 border-b text-slate-400 font-bold">
              <tr>
                <th class="p-3">الطالب</th>
                <th class="p-3">الامتحان</th>
                <th class="p-3">الدرجة</th>
                <th class="p-3">النسبة</th>
                <th class="p-3">مخالفات الغش</th>
                <th class="p-3">التاريخ</th>
              </tr>
            </thead>
            <tbody class="divide-y divide-slate-100 dark:divide-slate-800">
              ${attempts.map(a => `
                <tr>
                  <td class="p-3 font-bold">${a.userName}</td>
                  <td class="p-3 text-slate-500">${a.examTitle}</td>
                  <td class="p-3 font-mono font-bold">${a.score} / ${a.totalMarks}</td>
                  <td class="p-3">
                    <span class="px-2 py-0.5 rounded-full text-[10px] font-bold ${a.passed ? 'bg-emerald-100 text-emerald-700' : 'bg-rose-100 text-rose-700'}">
                      ${a.percentage}%
                    </span>
                  </td>
                  <td class="p-3">
                    ${a.cheatViolations > 0 ? `
                      <span class="px-2 py-0.5 rounded-full text-[10px] font-bold bg-rose-100 text-rose-700">
                        ⚠️ ${a.cheatViolations} مخالفات
                      </span>
                    ` : `
                      <span class="text-slate-400">لا يوجد</span>
                    `}
                  </td>
                  <td class="p-3 text-slate-400">${new Date(a.submittedAt).toLocaleDateString('ar-EG')}</td>
                </tr>
              `).join('')}
            </tbody>
          </table>
        </div>
      `);
    }

    // دالة تصدير كشف الدرجات إلى ملف CSV يدعم اللغة العربية بترميز UTF-8
    function exportResultsToCSV() {
      const attempts = DB.get('attempts');
      if (!attempts.length) {
        showToast("لا توجد أي نتائج لتصديرها حالياً", true);
        return;
      }

      let csv = "\uFEFFاسم الطالب,البريد الإلكتروني,المادة,اسم الامتحان,الدرجة,الدرجة النهائية,النسبة المئوية,حالة النجاح,مخالفات الغش,تاريخ التسليم\n";

      attempts.forEach(a => {
        csv += `"${a.userName}","${a.userEmail || ''}","${a.subject || ''}","${a.examTitle}",${a.score},${a.totalMarks},"${a.percentage}%","${a.passed ? 'ناجح' : 'راسب'}",${a.cheatViolations || 0},"${new Date(a.submittedAt).toLocaleString('ar-EG')}"\n`;
      });

      const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.setAttribute("href", url);
      link.setAttribute("download", `كشف_نتائج_الطلاب_${new Date().toISOString().slice(0,10)}.csv`);
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      showToast("تم تنزيل كشف درجات الطلاب بنجاح!");
    }

    // إطلاق المنصة فور الجاهزية
    document.addEventListener('DOMContentLoaded', () => { renderCurrentRoute(); });
    if (document.readyState === 'complete' || document.readyState === 'interactive') {
      renderCurrentRoute();
    }
  </script>
</body>
</html>
