<!DOCTYPE html>
<html lang="ar" dir="rtl" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>منصة الامتحانات الإلكترونية الاحترافية</title>
  
  <!-- خط كايرا العربي وتنسيقات التصميم -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  
  <!-- مكتبة Tailwind CSS للتصميم السريع والمتقدم -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: { cairo: ['Cairo', 'Tahoma', 'sans-serif'] },
          colors: {
            brand: { 50: '#ecfdf5', 100: '#d1fae5', 500: '#10b981', 600: '#059669', 700: '#047857' }
          }
        }
      }
    }
  </script>

  <style>
    body { font-family: 'Cairo', Tahoma, sans-serif; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="h-full bg-slate-50 text-slate-800 dark:bg-slate-950 dark:text-slate-100 transition-colors duration-200">

  <!-- شريط التنبيهات (Toast) -->
  <div id="toast-container" class="fixed bottom-5 left-5 z-50 flex flex-col gap-2 pointer-events-none"></div>

  <!-- التطبيق بالكامل -->
  <div class="min-h-screen flex flex-col justify-between">
    <div>
      <!-- شريط التنقل العلوي Navbar -->
      <header class="sticky top-0 z-40 bg-white/95 dark:bg-slate-900/95 backdrop-blur border-b border-slate-200 dark:border-slate-800 shadow-sm">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between">
          <div class="flex items-center gap-3 cursor-pointer" onclick="navigate('#home')">
            <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-brand-600 to-emerald-400 flex items-center justify-center text-white shadow-md font-extrabold text-xl">
              E
            </div>
            <span class="font-extrabold text-lg sm:text-xl tracking-tight">
              منصة <span class="text-brand-600">الامتحانات</span>
            </span>
          </div>

          <nav class="hidden md:flex items-center gap-6 text-sm font-semibold" id="main-nav-links">
            <!-- يُحقن ديناميكياً بواسطة JavaScript -->
          </nav>

          <div class="flex items-center gap-2 sm:gap-3" id="navbar-actions">
            <!-- يُحقن ديناميكياً -->
          </div>
        </div>
      </header>

      <!-- الحاوية الرئيسية لتغيير الصفحات -->
      <main id="app-root" class="w-full">
        <!-- يتم عرض محتوى الصفحات هنا -->
      </main>
    </div>

    <footer class="mt-16 border-t border-slate-200 dark:border-slate-800 py-6 text-center text-xs text-slate-400">
      منصة الامتحانات الإلكترونية المتقدمة © <span id="current-year"></span> - جميع الحقوق محفوظة
    </footer>
  </div>

  <!-- نافذة التعديل (Modal) العامة -->
  <div id="modal-container"></div>

  <!-- ========================================================================= -->
  <!-- محرك النظام البرمجي الكامل (Native JavaScript 100% بدون أي أخطاء أو تعليق) -->
  <!-- ========================================================================= -->
  <script>
    document.getElementById('current-year').innerText = new Date().getFullYear();

    // 1. قاعدة البيانات الافتراضية المدمجة
    const INITIAL_DB = {
      users: [
        { uid: 'admin_1', email: 'admin@exam.com', displayName: 'المسؤول العام', role: 'admin', disabled: false, grade: 'الإدارة' },
        { uid: 'user_1', email: 'student@exam.com', displayName: 'أحمد محمود', role: 'user', disabled: false, grade: 'الثالث الثانوي' }
      ],
      exams: [
        {
          id: 'ex_1',
          title: 'اختبار اللغة العربية - النحو والبلاغة',
          subject: 'اللغة العربية',
          grade: 'الثالث الثانوي',
          description: 'اختبار شامل ومكثف يقيس الفهم العميق لقواعد النحو وفنون البلاغة العربية.',
          durationMinutes: 15,
          totalMarks: 30,
          passMarks: 15,
          isPublished: true,
          shuffleQuestions: true,
          showAnswersAfterExam: true,
          questionCount: 3
        },
        {
          id: 'ex_2',
          title: 'اختبار الفيزياء - الكهربية والتيار المتردد',
          subject: 'الفيزياء',
          grade: 'الثالث الثانوي',
          description: 'أسئلة معيارية على الدوائر الكهربية، الحث الكهرومغناطيسي ودينامو التيار المتردد.',
          durationMinutes: 20,
          totalMarks: 40,
          passMarks: 20,
          isPublished: true,
          shuffleQuestions: false,
          showAnswersAfterExam: true,
          questionCount: 2
        }
      ],
      questions: [
        {
          id: 'q_1',
          examId: 'ex_1',
          text: 'ما إعراب كلمة "حقاً" في جملة: (إنَّ هذا العلمَ لهو الفوزُ حقاً)؟',
          options: ['مفعول مطلق لفعل محذوف', 'حال منصوبة', 'تمييز منصوب وعلامة نصبه الفتحة', 'مفعول لأجله'],
          correctOptionIndex: 0,
          order: 1
        },
        {
          id: 'q_2',
          examId: 'ex_1',
          text: 'نوع الصورة البيانية في قول الشاعر: "وسلا مصرَ هل سلا القلبُ عنها"؟',
          options: ['استعارة تصريحية', 'استعارة مكنية في (سلا مصر)', 'تشبيه بليغ', 'مجاز مرسل'],
          correctOptionIndex: 1,
          order: 2
        },
        {
          id: 'q_3',
          examId: 'ex_1',
          text: 'حكم تأنيث الفعل مع الفاعل في جملة: (أشرقت الشمسُ)؟',
          options: ['واجب التأنيث', 'جائز التأنيث', 'يمتنع التأنيث', 'مستحب فقط'],
          correctOptionIndex: 1,
          order: 3
        },
        {
          id: 'q_4',
          examId: 'ex_2',
          text: 'وحدة قياس معامل الحث الذاتي (الهنري) تكافئ رياضياً:',
          options: ['فولت . ثانية / أمبير', 'أوم . ثانية', 'جول / أمبير²', 'جميع ما سبق صحيح ومكافئ'],
          correctOptionIndex: 3,
          order: 1
        },
        {
          id: 'q_5',
          examId: 'ex_2',
          text: 'عند مضاعفة سرعة دوران ملف الدينامو إلى الضعف، فإن القوة الدافعة الكهربية العظمى المستحثة:',
          options: ['تزداد إلى الضعف', 'تظل ثابتة لا تتغير', 'تزداد إلى أربعة أمثالها', 'تقل إلى النصف'],
          correctOptionIndex: 0,
          order: 2
        }
      ],
      attempts: []
    };

    // 2. إدارة التخزين المحلي (Storage Engine)
    const DB = {
      init() {
        if (!localStorage.getItem('ex_users')) {
          localStorage.setItem('ex_users', JSON.stringify(INITIAL_DB.users));
          localStorage.setItem('ex_exams', JSON.stringify(INITIAL_DB.exams));
          localStorage.setItem('ex_questions', JSON.stringify(INITIAL_DB.questions));
          localStorage.setItem('ex_attempts', JSON.stringify(INITIAL_DB.attempts));
        }
      },
      get(table) {
        this.init();
        return JSON.parse(localStorage.getItem(`ex_${table}`) || '[]');
      },
      save(table, data) {
        localStorage.setItem(`ex_${table}`, JSON.stringify(data));
      },
      add(table, item) {
        const list = this.get(table);
        const newItem = { id: 'id_' + Date.now(), ...item };
        list.push(newItem);
        this.save(table, list);
        return newItem;
      },
      update(table, id, updates) {
        const list = this.get(table);
        const idx = list.findIndex(x => (x.id === id || x.uid === id));
        if (idx !== -1) {
          list[idx] = { ...list[idx], ...updates };
          this.save(table, list);
        }
      },
      delete(table, id) {
        const list = this.get(table).filter(x => x.id !== id);
        this.save(table, list);
      }
    };
    DB.init();

    // 3. إدارة حالة المستخدم والواجهة
    let currentUser = JSON.parse(localStorage.getItem('ex_session_user') || 'null');
    let examTimerInterval = null;

    function showToast(message, isError = false) {
      const container = document.getElementById('toast-container');
      const toast = document.createElement('div');
      toast.className = `px-5 py-3 rounded-2xl shadow-xl flex items-center gap-3 text-white text-xs font-bold transition-all duration-300 transform translate-y-4 pointer-events-auto ${isError ? 'bg-rose-600' : 'bg-emerald-600'}`;
      toast.innerHTML = `<span>${isError ? '⚠️' : '✅'}</span><span>${message}</span>`;
      container.appendChild(toast);
      setTimeout(() => toast.classList.remove('translate-y-4'), 10);
      setTimeout(() => {
        toast.classList.add('opacity-0');
        setTimeout(() => toast.remove(), 300);
      }, 3500);
    }

    function toggleDarkMode() {
      const isDark = document.documentElement.classList.toggle('dark');
      localStorage.setItem('ex_theme', isDark ? 'dark' : 'light');
      updateNavbar();
    }
    if (localStorage.getItem('ex_theme') === 'dark') {
      document.documentElement.classList.add('dark');
    }

    function navigate(hash) {
      window.location.hash = hash;
    }

    window.addEventListener('hashchange', renderCurrentRoute);

    // 4. تحديث شريط التنقل
    function updateNavbar() {
      const isDark = document.documentElement.classList.contains('dark');
      const navLinks = document.getElementById('main-nav-links');
      const actions = document.getElementById('navbar-actions');
      const hash = window.location.hash || '#home';

      navLinks.innerHTML = `
        <button onclick="navigate('#home')" class="hover:text-brand-600 transition ${hash === '#home' ? 'text-brand-600 font-bold' : ''}">الرئيسية</button>
        <button onclick="navigate('#exams')" class="hover:text-brand-600 transition ${hash === '#exams' ? 'text-brand-600 font-bold' : ''}">الامتحانات</button>
        ${currentUser ? `<button onclick="navigate('#my-results')" class="hover:text-brand-600 transition ${hash === '#my-results' ? 'text-brand-600 font-bold' : ''}">نتائجي</button>` : ''}
        ${currentUser && currentUser.role === 'admin' ? `
          <button onclick="navigate('#admin/dashboard')" class="text-amber-600 dark:text-amber-400 flex items-center gap-1 font-bold">
            <span>لوحة الإدارة</span>
            <span class="text-[10px] bg-amber-100 dark:bg-amber-950/60 px-2 py-0.5 rounded-full">Admin</span>
          </button>
        ` : ''}
      `;

      actions.innerHTML = `
        <button onclick="toggleDarkMode()" class="p-2 rounded-xl text-sm bg-slate-100 dark:bg-slate-800">
          ${isDark ? '☀️' : '🌙'}
        </button>
        ${currentUser ? `
          <button onclick="navigate('#profile')" class="flex items-center gap-2 bg-slate-100 dark:bg-slate-800 py-1.5 px-3 rounded-full hover:opacity-80">
            <div class="w-7 h-7 rounded-full bg-brand-600 text-white font-bold text-xs flex items-center justify-center">
              ${(currentUser.displayName || currentUser.email).charAt(0).toUpperCase()}
            </div>
            <span class="text-xs font-bold hidden sm:inline">${currentUser.displayName || currentUser.email}</span>
          </button>
          <button onclick="handleLogout()" class="text-xs text-rose-600 font-bold hover:bg-rose-50 dark:hover:bg-rose-950/30 p-2 rounded-xl">خروج</button>
        ` : `
          <button onclick="navigate('#login')" class="text-xs font-bold text-brand-600 px-3 py-2 rounded-xl hover:bg-brand-50">دخول</button>
          <button onclick="navigate('#register')" class="text-xs font-bold bg-brand-600 text-white px-3.5 py-2 rounded-xl shadow hover:bg-brand-700">حساب جديد</button>
        `}
      `;
    }

    function handleLogout() {
      currentUser = null;
      localStorage.removeItem('ex_session_user');
      showToast("تم تسجيل الخروج");
      updateNavbar();
      navigate('#home');
    }

    // 5. موجه الصفحات وعرضها (Router & Page Renderers)
    function renderCurrentRoute() {
      if (examTimerInterval) {
        clearInterval(examTimerInterval);
        examTimerInterval = null;
      }
      updateNavbar();
      const root = document.getElementById('app-root');
      const hash = window.location.hash || '#home';

      if (hash === '#home') renderHome(root);
      else if (hash === '#login') renderAuth(root, false);
      else if (hash === '#register') renderAuth(root, true);
      else if (hash === '#exams') renderExamsList(root);
      else if (hash.startsWith('#exam/')) renderExamSession(root, hash.split('#exam/')[1]);
      else if (hash.startsWith('#result/')) renderResult(root, hash.split('#result/')[1]);
      else if (hash === '#my-results') renderMyResults(root);
      else if (hash === '#profile') renderProfile(root);
      else if (hash === '#admin/login') renderAdminLogin(root);
      else if (hash === '#admin/dashboard') renderAdminDashboard(root);
      else if (hash === '#admin/exams') renderAdminExams(root);
      else if (hash.startsWith('#admin/questions/')) renderAdminQuestions(root, hash.split('#admin/questions/')[1]);
      else if (hash === '#admin/users') renderAdminUsers(root);
      else if (hash === '#admin/results') renderAdminResults(root);
      else renderHome(root);

      window.scrollTo(0, 0);
    }

    // --- صفحة الرئيسية ---
    function renderHome(root) {
      root.innerHTML = `
        <div class="py-12 px-4 max-w-6xl mx-auto space-y-16">
          <div class="text-center space-y-5 max-w-3xl mx-auto">
            <div class="inline-block bg-brand-100 dark:bg-brand-950/60 text-brand-700 dark:text-brand-300 px-4 py-1.5 rounded-full text-xs font-black">
              منصة الاختبارات الذكية - جاهزة وفورية بدون أي تعليق ⚡
            </div>
            <h1 class="text-4xl sm:text-6xl font-black text-slate-900 dark:text-white leading-tight">
              اختبر معلوماتك <span class="text-brand-600">بدقة وسرعة</span> وحقق أعلى الدرجات
            </h1>
            <p class="text-sm sm:text-base text-slate-500 dark:text-slate-400">
              مؤقت تنازلي ذكي، حفظ فوري للإجابات يمنع ضياع مجهودك، وتصحيح تفصيلي فوري.
            </p>
            <div class="flex flex-wrap items-center justify-center gap-3 pt-4">
              <button onclick="navigate(currentUser ? '#exams' : '#register')" class="px-8 py-3.5 bg-brand-600 hover:bg-brand-700 text-white font-bold rounded-2xl shadow-lg transition">
                ابدأ الامتحانات الآن
              </button>
              <button onclick="navigate('#admin/login')" class="px-6 py-3.5 bg-slate-200 dark:bg-slate-800 hover:bg-slate-300 dark:hover:bg-slate-700 font-bold rounded-2xl text-xs sm:text-sm">
                بوابة المسؤول (Admin) 🛡️
              </button>
            </div>

            <!-- بطاقة مساعدة للتجربة الفورية -->
            <div class="mt-8 p-4 bg-amber-50 dark:bg-amber-950/30 border border-amber-200 dark:border-amber-800/50 rounded-2xl text-xs text-amber-800 dark:text-amber-200 max-w-md mx-auto text-right">
              <span class="font-bold block mb-1">💡 حسابات تجريبية معدّة مسبقاً للدخول الفوري:</span>
              <div>• المسؤول: <span class="font-mono font-bold">admin@exam.com</span> (كلمة السر: أي قيمة)</div>
              <div>• الطالب: <span class="font-mono font-bold">student@exam.com</span> (كلمة السر: أي قيمة)</div>
            </div>
          </div>

          <div class="grid md:grid-cols-3 gap-6">
            <div class="p-6 bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-3xl shadow-sm space-y-2">
              <div class="text-2xl">⏱️</div>
              <h3 class="font-bold text-base">مؤقت تفاعلي وتسليم آلي</h3>
              <p class="text-xs text-slate-500 leading-relaxed">ينبهك بالوقت المتبقي ويسلّم إجاباتك تلقائياً وبدقة عند انتهاء الوقت.</p>
            </div>
            <div class="p-6 bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-3xl shadow-sm space-y-2">
              <div class="text-2xl">💾</div>
              <h3 class="font-bold text-base">حفظ الإجابات عند التحديث</h3>
              <p class="text-xs text-slate-500 leading-relaxed">إجاباتك محفوظة لحظة بلحظة حتى لو قمت بعمل Refresh للمتصفح بالخطأ.</p>
            </div>
            <div class="p-6 bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-3xl shadow-sm space-y-2">
              <div class="text-2xl">🎯</div>
              <h3 class="font-bold text-base">تصحيح فوري وإجابات نموذجية</h3>
              <p class="text-xs text-slate-500 leading-relaxed">تقرير مفصل لدرجتك مع مراجعة كاملة للأسئلة الصحيحة والخاطئة.</p>
            </div>
          </div>
        </div>
      `;
    }

    // --- صفحة الدخول والتسجيل ---
    function renderAuth(root, isRegister) {
      root.innerHTML = `
        <div class="min-h-[75vh] flex items-center justify-center p-4">
          <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-3xl p-8 max-w-md w-full shadow-xl">
            <h2 class="text-2xl font-black mb-1 text-center">${isRegister ? 'إنشاء حساب طالب جديد' : 'تسجيل دخول الطالب'}</h2>
            <p class="text-xs text-slate-400 text-center mb-6">أدخل بريدك وكلمة المرور للمتابعة</p>

            <form id="auth-form" class="space-y-4">
              ${isRegister ? `
                <div>
                  <label class="block text-xs font-bold mb-1">الاسم بالكامل</label>
                  <input id="auth-name" required class="w-full px-4 py-2.5 rounded-xl border border-slate-300 dark:border-slate-700 bg-slate-50 dark:bg-slate-950 text-xs outline-none" placeholder="محمد أحمد" />
                </div>
                <div>
                  <label class="block text-xs font-bold mb-1">المرحلة الدراسية</label>
                  <select id="auth-grade" class="w-full px-4 py-2.5 rounded-xl border border-slate-300 dark:border-slate-700 bg-slate-50 dark:bg-slate-950 text-xs outline-none">
                    <option value="الأول الثانوي">الأول الثانوي</option>
                    <option value="الثاني الثانوي">الثاني الثانوي</option>
                    <option value="الثالث الثانوي">الثالث الثانوي</option>
                  </select>
                </div>
              ` : ''}

              <div>
                <label class="block text-xs font-bold mb-1">البريد الإلكتروني</label>
                <input id="auth-email" type="email" required class="w-full px-4 py-2.5 rounded-xl border border-slate-300 dark:border-slate-700 bg-slate-50 dark:bg-slate-950 text-xs outline-none" placeholder="name@example.com" dir="ltr" />
              </div>

              <div>
                <label class="block text-xs font-bold mb-1">كلمة المرور</label>
                <input id="auth-password" type="password" required class="w-full px-4 py-2.5 rounded-xl border border-slate-300 dark:border-slate-700 bg-slate-50 dark:bg-slate-950 text-xs outline-none" placeholder="••••••••" dir="ltr" />
              </div>

              <button type="submit" class="w-full py-3 bg-brand-600 hover:bg-brand-700 text-white font-bold rounded-xl shadow text-xs transition">
                ${isRegister ? 'تسجيل الحساب' : 'دخول'}
              </button>
            </form>

            <div class="mt-6 text-center text-xs text-slate-500">
              ${isRegister ? `
                <span>لديك حساب بالفعل؟ <button onclick="navigate('#login')" class="text-brand-600 font-bold hover:underline">سجل دخولك</button></span>
              ` : `
                <span>ليس لديك حساب؟ <button onclick="navigate('#register')" class="text-brand-600 font-bold hover:underline">سجل مجاناً</button></span>
              `}
            </div>
          </div>
        </div>
      `;

      document.getElementById('auth-form').onsubmit = function(e) {
        e.preventDefault();
        const email = document.getElementById('auth-email').value.trim();
        const users = DB.get('users');

        if (isRegister) {
          const name = document.getElementById('auth-name').value.trim();
          const grade = document.getElementById('auth-grade').value;
          if (users.find(u => u.email.toLowerCase() === email.toLowerCase())) {
            showToast("هذا البريد مسجل مسبقاً!", true);
            return;
          }
          const newUser = { uid: 'u_' + Date.now(), email, displayName: name, role: 'user', disabled: false, grade };
          DB.add('users', newUser);
          currentUser = newUser;
          localStorage.setItem('ex_session_user', JSON.stringify(newUser));
          showToast("تم إنشاء الحساب بنجاح!");
        } else {
          let user = users.find(u => u.email.toLowerCase() === email.toLowerCase());
          if (!user) {
            user = { uid: 'u_' + Date.now(), email, displayName: email.split('@')[0], role: 'user', disabled: false, grade: 'الثالث الثانوي' };
            DB.add('users', user);
          } else if (user.disabled) {
            showToast("هذا الحساب معطل حالياً من قِبل الإدارة", true);
            return;
          }
          currentUser = user;
          localStorage.setItem('ex_session_user', JSON.stringify(user));
          showToast("تم تسجيل الدخول بنجاح");
        }
        updateNavbar();
        navigate('#exams');
      };
    }

    // --- صفحة قائمة الامتحانات المتاحة ---
    function renderExamsList(root) {
      const exams = DB.get('exams').filter(e => e.isPublished);

      root.innerHTML = `
        <div class="max-w-6xl mx-auto px-4 py-8 space-y-6">
          <div>

    function startExam(id) {
      if (!currentUser) {
        showToast("يرجى تسجيل الدخول أولاً للبدء في الاختبار", true);
        navigate('#login');
      } else {
        navigate(`#exam/${id}`);
      }
    }

    // --- غرفة الاختبار التفاعلية (Timer, Auto-Save, Auto-Submit) ---
    let examState = {
      exam: null,
      questions: [],
      currentIndex: 0,
      answers: {},
      timeLeft: 0
    };

    function renderExamSession(root, examId) {
      if (!currentUser) { navigate('#login'); return; }

      const exam = DB.get('exams').find(e => e.id === examId);
      if (!exam) { navigate('#exams'); return; }

      let questions = DB.get('questions').filter(q => q.examId === examId);
      if (exam.shuffleQuestions) {
        questions = [...questions].sort(() => Math.random() - 0.5);
      }

      const sessionKey = `active_exam_${examId}_${currentUser.uid}`;
      const saved = localStorage.getItem(sessionKey);
      
      examState.exam = exam;
      examState.questions = questions;
      examState.currentIndex = 0;
      examState.answers = saved ? JSON.parse(saved).answers : {};
      examState.timeLeft = saved ? JSON.parse(saved).timeLeft : (exam.durationMinutes * 60);

      renderExamUI(root);

      // تشغيل العداد التنازلي التلقائي
      examTimerInterval = setInterval(() => {
        examState.timeLeft--;
        localStorage.setItem(sessionKey, JSON.stringify({ answers: examState.answers, timeLeft: examState.timeLeft }));

        const mins = Math.floor(examState.timeLeft / 60);
        const secs = examState.timeLeft % 60;
        const timerElem = document.getElementById('session-timer-text');
        if (timerElem) {
          timerElem.innerText = `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
        }

        if (examState.timeLeft <= 0) {
          clearInterval(examTimerInterval);
          submitExamSession(true);
        }
      }, 1000);
    }

    function renderExamUI(root) {
      const { exam, questions, currentIndex, answers, timeLeft } = examState;
      const q = questions[currentIndex];
      const mins = Math.floor(timeLeft / 60);
      const secs = timeLeft % 60;

      root.innerHTML = `
        <div class="max-w-4xl mx-auto px-4 py-6 space-y-6">
          <div class="bg-white dark:bg-slate-900 rounded-3xl p-5 border border-slate-200 dark:border-slate-800 flex justify-between items-center shadow-sm">
            <div>
              <span class="text-[10px] font-bold text-brand-600">${exam.subject}</span>
              <h2 class="font-extrabold text-base">${exam.title}</h2>
            </div>
            <div class="flex items-center gap-3">
              <div class="font-mono text-sm font-black px-3 py-1.5 rounded-xl bg-slate-100 dark:bg-slate-800">
                ⏰ <span id="session-timer-text">${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}</span>
              </div>
              <button onclick="confirmSubmitExam()" class="px-4 py-2 bg-brand-600 hover:bg-brand-700 text-white rounded-xl text-xs font-bold shadow">
                إنهاء وتسليم
              </button>
            </div>
          </div>

          <div class="grid md:grid-cols-4 gap-6">
            <div class="md:col-span-3 space-y-4">
              <div class="bg-white dark:bg-slate-900 rounded-3xl p-6 border border-slate-200 dark:border-slate-800 space-y-6 shadow-sm">
                <div class="flex justify-between text-xs text-slate-400 font-bold">
                  <span>سؤال ${currentIndex + 1} من ${questions.length}</span>
                  <span>اختر إجابة واحدة صحيحة</span>
                </div>

                <h3 class="font-bold text-lg leading-relaxed">${q.text}</h3>

                <div class="space-y-3">
                  ${q.options.map((opt, oIdx) => {
                    const isSelected = answers[q.id] === oIdx;
                    return `
                      <div
                        onclick="selectExamOption('${q.id}', ${oIdx})"
                        class="cursor-pointer p-3.5 rounded-2xl border-2 transition flex items-center gap-3 text-xs sm:text-sm font-semibold ${
                          isSelected ? 'border-brand-600 bg-brand-50/70 dark:bg-brand-950/40 text-brand-900 dark:text-brand-200' : 'border-slate-200 dark:border-slate-800 hover:border-slate-300'
                        }"
                      >
                        <div class="w-6 h-6 rounded-full flex items-center justify-center text-xs font-bold border ${isSelected ? 'bg-brand-600 text-white border-brand-600' : 'border-slate-400'}">
                          ${['أ', 'ب', 'ج', 'د'][oIdx] || oIdx + 1}
                        </div>
                        <span>${opt}</span>
                      </div>
                    `;
                  }).join('')}
                </div>

                <div class="flex justify-between pt-4 border-t border-slate-100 dark:border-slate-800">
                  <button ${currentIndex === 0 ? 'disabled' : ''} onclick="changeQuestion(-1)" class="px-4 py-2 text-xs font-bold border rounded-xl disabled:opacity-30">السابق</button>
                  ${currentIndex < questions.length - 1 ? `
                    <button onclick="changeQuestion(1)" class="px-5 py-2 text-xs font-bold bg-slate-900 text-white dark:bg-white dark:text-slate-900 rounded-xl shadow">التالي</button>
                  ` : `
                    <button onclick="confirmSubmitExam()" class="px-5 py-2 text-xs font-bold bg-brand-600 text-white rounded-xl shadow">مراجعة وتسليم</button>
                  `}
                </div>
              </div>
            </div>

            <div class="space-y-4">
              <div class="bg-white dark:bg-slate-900 rounded-3xl p-4 border border-slate-200 dark:border-slate-800 shadow-sm space-y-3">
                <span class="text-xs font-bold text-slate-400 block">فهرس الأسئلة</span>
                <div class="grid grid-cols-4 gap-2">
                  ${questions.map((item, idx) => `
                    <button
                      onclick="goToQuestion(${idx})"
                      class="h-9 rounded-xl font-bold text-xs ${currentIndex === idx ? 'ring-2 ring-brand-500' : ''} ${answers[item.id] !== undefined ? 'bg-brand-600 text-white' : 'bg-slate-100 dark:bg-slate-800'}"
                    >
                      ${idx + 1}
                    </button>
                  `).join('')}
                </div>
              </div>
            </div>
          </div>
        </div>
      `;
    }

    function selectExamOption(qId, oIdx) {
      examState.answers[qId] = oIdx;
      const sessionKey = `active_exam_${examState.exam.id}_${currentUser.uid}`;
      localStorage.setItem(sessionKey, JSON.stringify({ answers: examState.answers, timeLeft: examState.timeLeft }));
      renderExamUI(document.getElementById('app-root'));
    }

    function changeQuestion(delta) {
      examState.currentIndex += delta;
      renderExamUI(document.getElementById('app-root'));
    }

    function goToQuestion(idx) {
      examState.currentIndex = idx;
      renderExamUI(document.getElementById('app-root'));
    }

    function confirmSubmitExam() {
      const answeredCount = Object.keys(examState.answers).length;
      const total = examState.questions.length;

      document.getElementById('modal-container').innerHTML = `
        <div class="fixed inset-0 z-50 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4">
          <div class="bg-white dark:bg-slate-900 rounded-3xl max-w-sm w-full p-6 text-center space-y-4 shadow-2xl border">
            <span class="text-3xl">⚠️</span>
            <h3 class="font-bold text-base">هل أنت متأكد من تسليم الامتحان؟</h3>
            <p class="text-xs text-slate-400">لقد أجبت على (${answeredCount}) من أصل (${total}) سؤالاً.</p>
            <div class="flex gap-2">
              <button onclick="document.getElementById('modal-container').innerHTML=''" class="flex-1 py-2 rounded-xl text-xs font-bold border">متابعة الحل</button>
              <button onclick="submitExamSession(false)" class="flex-1 py-2 rounded-xl text-xs font-bold bg-brand-600 text-white shadow">تأكيد التسليم</button>
            </div>
          </div>
        </div>
      `;
    }

    function submitExamSession(isTimeout = false) {
      document.getElementById('modal-container').innerHTML = '';
      if (examTimerInterval) clearInterval(examTimerInterval);

      const { exam, questions, answers } = examState;
      let correctCount = 0;
      const markPerQ = exam.totalMarks / (questions.length || 1);

      questions.forEach(q => {
        if (answers[q.id] === q.correctOptionIndex) correctCount++;
      });

      const score = Math.round(correctCount * markPerQ);
      const percentage = Math.round((score / exam.totalMarks) * 100);
      const passed = score >= exam.passMarks;

      const attempt = DB.add('attempts', {
        examId: exam.id,
        examTitle: exam.title,
        subject: exam.subject,
        userId: currentUser.uid,
        userName: currentUser.displayName,
        answers,
        score,
        totalMarks: exam.totalMarks,
        percentage,
        passed,
        correctCount,
        wrongCount: questions.length - correctCount,
        submittedAt: new Date().toISOString()
      });

      localStorage.removeItem(`active_exam_${exam.id}_${currentUser.uid}`);
      showToast(isTimeout ? "انتهى الوقت وتم تسليم الإجابات تلقائياً" : "تم تسليم الامتحان بنجاح!");
      navigate(`#result/${attempt.id}`);
    }

          ${exam && exam.showAnswersAfterExam ? `

              ${questions.map((q, idx) => {
                const userAns = attempt.answers[q.id];
                const isCorrect = userAns === q.correctOptionIndex;
                return `
                  <div class="p-5 rounded-3xl border bg-white dark:bg-slate-900 space-y-3 shadow-sm">
                    <div class="flex justify-between text-xs font-bold">
                      <span>سؤال ${idx + 1}</span>

                    </div>
                    <p class="font-bold text-sm">${q.text}</p>
                    <div class="space-y-2">
                      ${q.options.map((opt, oIdx) => {
                        const isRight = q.correctOptionIndex === oIdx;
                        const wasChosen = userAns === oIdx;
                        let st = 'border-slate-200 dark:border-slate-800';
                        if (isRight) st = 'border-emerald-500 bg-emerald-50/60 dark:bg-emerald-950/30 text-emerald-700 font-bold';

      const tabs = [
        { id: 'dashboard', label: 'الإحصائيات', icon: '📊', route: '#admin/dashboard' },
        { id: 'exams', label: 'الامتحانات', icon: '📝', route: '#admin/exams' },
        { id: 'users', label: 'الطلاب', icon: '👥', route: '#admin/users' },
        { id: 'results', label: 'كافة النتائج', icon: '🏆', route: '#admin/results' }
      ];

      return `
        <div class="max-w-6xl mx-auto px-4 py-8 flex flex-col md:flex-row gap-6">
          <aside class="w-full md:w-56 space-y-1">
            <div class="p-3 bg-white dark:bg-slate-900 rounded-2xl border space-y-1 shadow-sm">
              <span class="text-[10px] font-bold text-slate-400 px-3 py-1 block">لوحة الإدارة</span>
              ${tabs.map(t => `
                <button
                  onclick="navigate('${t.route}')"
                  class="w-full flex items-center gap-2 px-3 py-2 rounded-xl text-xs font-bold transition ${tab === t.id ? 'bg-amber-500 text-slate-950 font-black' : 'hover:bg-slate-100 dark:hover:bg-slate-800'}"
                >
                  <span>${t.icon}</span>
                  <span>${t.label}</span>
                </button>
              `).join('')}
            </div>
          </aside>

          <main class="flex-1 space-y-6">
            ${contentHtml}
          </main>
        </div>
      `;
    }

    function renderAdminDashboard(root) {
      const users = DB.get('users');
      const exams = DB.get('exams');
      const attempts = DB.get('attempts');
      const avg = attempts.length ? Math.round(attempts.reduce((a, b) => a + (b.percentage || 0), 0) / attempts.length) : 0;

      root.innerHTML = renderAdminLayout('dashboard', `
        <h2 class="text-2xl font-black">نظرة عامة على المنصة</h2>
        <div class="grid grid-cols-2 sm:grid-cols-4 gap-4">
          <div class="p-4 bg-white dark:bg-slate-900 rounded-2xl border shadow-sm">
            <span class="text-[11px] text-slate-400 block mb-1">الطلاب المسجلين</span>
            <span class="text-2xl font-black text-blue-600">${users.length}</span>
          </div>
          <div class="p-4 bg-white dark:bg-slate-900 rounded-2xl border shadow-sm">
            <span class="text-[11px] text-slate-400 block mb-1">إجمالي الامتحانات</span>
            <span class="text-2xl font-black text-amber-600">${exams.length}</span>
          </div>
          <div class="p-4 bg-white dark:bg-slate-900 rounded-2xl border shadow-sm">
            <span class="text-[11px] text-slate-400 block mb-1">المحاولات المنجزة</span>
            <span class="text-2xl font-black text-emerald-600">${attempts.length}</span>
          </div>
          <div class="p-4 bg-white dark:bg-slate-900 rounded-2xl border shadow-sm">
            <span class="text-[11px] text-slate-400 block mb-1">متوسط الدرجات</span>
            <span class="text-2xl font-black text-purple-600">${avg}%</span>
          </div>
        </div>
      `);
    }

    function renderAdminExams(root) {
      const exams = DB.get('exams');

      root.innerHTML = renderAdminLayout('exams', `
        <div class="flex justify-between items-center">
          <h2 class="text-2xl font-black">إدارة الامتحانات</h2>
          <button onclick="openExamModal()" class="px-4 py-2 bg-brand-600 text-white rounded-xl text-xs font-bold shadow">
            + إنشاء امتحان جديد
          </button>
        </div>

        <div class="space-y-3">
          ${exams.map(exam => `
            <div class="bg-white dark:bg-slate-900 p-4 rounded-2xl border flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3 shadow-sm">
              <div>
                <div class="flex items-center gap-2 mb-1">
                  <span class="text-[10px] bg-slate-100 dark:bg-slate-800 px-2 py-0.5 rounded font-bold">${exam.subject}</span>
                  <span class="text-xs text-slate-400">${exam.grade}</span>
                  <span class="text-[10px] px-2 py-0.5 rounded-full font-bold ${exam.isPublished ? 'bg-emerald-100 text-emerald-700' : 'bg-slate-200 text-slate-600'}">
                    ${exam.isPublished ? 'منشور' : 'مسودة'}
                  </span>
                </div>
                <h4 class="font-extrabold text-sm">${exam.title}</h4>
                <p class="text-[11px] text-slate-400">المدة: ${exam.durationMinutes} د | الدرجة: ${exam.totalMarks}</p>
              </div>

              <div class="flex items-center gap-2">
                <button onclick="navigate('#admin/questions/${exam.id}')" class="px-3 py-1 bg-blue-50 text-blue-600 dark:bg-blue-950/40 rounded-xl text-xs font-bold">
                  الأسئلة (${DB.get('questions').filter(q => q.examId === exam.id).length})
                </button>
                <button onclick="toggleExamPublish('${exam.id}')" class="px-3 py-1 bg-slate-100 dark:bg-slate-800 rounded-xl text-xs font-bold">
                  ${exam.isPublished ? 'إخفاء' : 'نشر'}
                </button>
                <button onclick="deleteExam('${exam.id}')" class="px-3 py-1 bg-rose-50 text-rose-600 rounded-xl text-xs font-bold">
                  حذف
                </button>
              </div>
            </div>
          `).join('')}
        </div>
      `);
    }

    function toggleExamPublish(id) {
      const exam = DB.get('exams').find(e => e.id === id);
      if (exam) {
        DB.update('exams', id, { isPublished: !exam.isPublished });
        renderAdminExams(document.getElementById('app-root'));
      }
    }

    function deleteExam(id) {
      if (!confirm("هل أنت متأكد من حذف هذا الامتحان؟")) return;
      DB.delete('exams', id);
      showToast("تم حذف الامتحان");
      renderAdminExams(document.getElementById('app-root'));
    }

    function openExamModal() {
      document.getElementById('modal-container').innerHTML = `
        <div class="fixed inset-0 z-50 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4">
          <form id="new-exam-form" class="bg-white dark:bg-slate-900 rounded-3xl max-w-lg w-full p-6 space-y-4 shadow-2xl border">
            <h3 class="font-bold text-base">إنشاء امتحان جديد</h3>
            <div class="grid sm:grid-cols-2 gap-3 text-xs">
              <div>
                <label class="block font-bold mb-1">اسم الامتحان</label>
                <input id="ex-title" required class="w-full p-2 border rounded-xl dark:bg-slate-950" />
              </div>
              <div>
                <label class="block font-bold mb-1">المادة</label>
                <input id="ex-subject" required class="w-full p-2 border rounded-xl dark:bg-slate-950" />
              </div>
              <div>
                <label class="block font-bold mb-1">المدة (دقائق)</label>
                <input id="ex-duration" type="number" required value="20" class="w-full p-2 border rounded-xl dark:bg-slate-950" />
              </div>
              <div>
                <label class="block font-bold mb-1">الدرجة الكلية</label>
                <input id="ex-marks" type="number" required value="40" class="w-full p-2 border rounded-xl dark:bg-slate-950" />
              </div>
            </div>

            <div class="space-y-1 pt-2 border-t text-xs font-bold">
              <label class="flex items-center gap-2 cursor-pointer">
                <input id="ex-shuffle" type="checkbox" checked />
                <span>ترتيب الأسئلة عشوائياً للطلاب</span>
              </label>
              <label class="flex items-center gap-2 cursor-pointer">
                <input id="ex-show-ans" type="checkbox" checked />
                <span>إظهار الإجابات النموذجية بعد النتيجة</span>
              </label>
              <label class="flex items-center gap-2 cursor-pointer">
                <input id="ex-publish" type="checkbox" checked />
                <span>نشر الامتحان وجعله متاحاً فوراً</span>
              </label>
            </div>

            <div class="flex justify-end gap-2 pt-2">
              <button type="button" onclick="document.getElementById('modal-container').innerHTML=''" class="px-4 py-2 text-xs font-bold border rounded-xl">إلغاء</button>
              <button type="submit" class="px-5 py-2 text-xs font-bold bg-brand-600 text-white rounded-xl shadow">حفظ الامتحان</button>
            </div>
          </form>
        </div>
      `;

      document.getElementById('new-exam-form').onsubmit = function(e) {
        e.preventDefault();
        DB.add('exams', {
          title: document.getElementById('ex-title').value,
          subject: document.getElementById('ex-subject').value,
          grade: 'الثالث الثانوي',
          description: 'امتحان قياسي تقييمي شامل.',
          durationMinutes: Number(document.getElementById('ex-duration').value),
          totalMarks: Number(document.getElementById('ex-marks').value),
          passMarks: Number(document.getElementById('ex-marks').value) / 2,
          isPublished: document.getElementById('ex-publish').checked,
          shuffleQuestions: document.getElementById('ex-shuffle').checked,
          showAnswersAfterExam: document.getElementById('ex-show-ans').checked,
          questionCount: 0
        });
        document.getElementById('modal-container').innerHTML = '';
        showToast("تم إنشاء الامتحان بنجاح!");
        renderAdminExams(document.getElementById('app-root'));
      };
    }

    function renderAdminQuestions(root, examId) {
      const exam = DB.get('exams').find(e => e.id === examId);
      const questions = DB.get('questions').filter(q => q.examId === examId);

      root.innerHTML = renderAdminLayout('exams', `
        <div class="flex justify-between items-center">
          <div>
            <button onclick="navigate('#admin/exams')" class="text-xs text-slate-400 hover:underline">← العودة لقائمة الامتحانات</button>
            <h2 class="text-xl font-black mt-1">أسئلة: ${exam ? exam.title : ''}</h2>
          </div>
          <button onclick="openQuestionModal('${examId}')" class="px-4 py-2 bg-brand-600 text-white rounded-xl text-xs font-bold shadow">
            + إضافة سؤال MCQ
          </button>
        </div>

        <div class="space-y-3">
          ${questions.map((q, idx) => `
            <div class="bg-white dark:bg-slate-900 p-4 rounded-2xl border space-y-3 shadow-sm">
              <div class="flex justify-between items-start">
                <h4 class="font-bold text-xs"><span class="text-brand-600 ml-1">#${idx + 1}</span> ${q.text}</h4>
                <button onclick="deleteQuestion('${q.id}', '${examId}')" class="text-xs text-rose-600 font-bold hover:underline">حذف</button>
              </div>

              <div class="grid grid-cols-2 gap-2 text-xs">
                ${q.options.map((opt, oIdx) => `
                  <div class="p-2 rounded-xl border ${q.correctOptionIndex === oIdx ? 'bg-emerald-50 border-emerald-500 font-bold text-emerald-800' : 'border-slate-200 dark:border-slate-800'}">
                    ${opt} ${q.correctOptionIndex === oIdx ? '✓' : ''}
                  </div>
                `).join('')}
              </div>
            </div>
          `).join('')}
        </div>
      `);
    }

    function deleteQuestion(qId, examId) {
      if (!confirm("حذف هذا السؤال؟")) return;
      DB.delete('questions', qId);
      const questionsCount = DB.get('questions').filter(q => q.examId === examId).length;
      DB.update('exams', examId, { questionCount: questionsCount });
      showToast("تم حذف السؤال");
      renderAdminQuestions(document.getElementById('app-root'), examId);
    }

    function openQuestionModal(examId) {
      document.getElementById('modal-container').innerHTML = `
        <div class="fixed inset-0 z-50 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4">
          <form id="new-q-form" class="bg-white dark:bg-slate-900 rounded-3xl max-w-lg w-full p-6 space-y-3 shadow-2xl border">
            <h3 class="font-bold text-sm">إضافة سؤال اختيار من متعدد</h3>
            <div>
              <label class="block text-xs font-bold mb-1">نص السؤال</label>
              <textarea id="q-text" required class="w-full p-2.5 border rounded-xl dark:bg-slate-950 text-xs h-20" placeholder="اكتب نص السؤال هنا..."></textarea>
            </div>

            <div class="space-y-2">
              <label class="block text-xs font-bold">الخيارات الأربعة (حدد الراديو للإجابة الصحيحة):</label>
              ${[0, 1, 2, 3].map(i => `
                <div class="flex items-center gap-2">
                  <input type="radio" name="correct_opt" value="${i}" ${i === 0 ? 'checked' : ''} class="w-4 h-4 text-brand-600" />
                  <input id="q-opt-${i}" required class="flex-1 p-2 border rounded-xl dark:bg-slate-950 text-xs" placeholder="الخيار ${i + 1}" />
                </div>
              `).join('')}
            </div>

            <div class="flex justify-end gap-2 pt-2">
              <button type="button" onclick="document.getElementById('modal-container').innerHTML=''" class="px-4 py-2 text-xs font-bold border rounded-xl">إلغاء</button>
              <button type="submit" class="px-5 py-2 text-xs font-bold bg-brand-600 text-white rounded-xl shadow">حفظ السؤال</button>
            </div>
          </form>
        </div>
      `;

      document.getElementById('new-q-form').onsubmit = function(e) {
        e.preventDefault();
        const selectedRadio = document.querySelector('input[name="correct_opt"]:checked');
        const correctIdx = Number(selectedRadio.value);

        DB.add('questions', {
          examId,
          text: document.getElementById('q-text').value,
          options: [
            document.getElementById('q-opt-0').value,
            document.getElementById('q-opt-1').value,
            document.getElementById('q-opt-2').value,
            document.getElementById('q-opt-3').value
          ],
          correctOptionIndex: correctIdx
        });

        const questionsCount = DB.get('questions').filter(q => q.examId === examId).length;
        DB.update('exams', examId, { questionCount: questionsCount });

        document.getElementById('modal-container').innerHTML = '';
        showToast("تمت إضافة السؤال بنجاح!");
        renderAdminQuestions(document.getElementById('app-root'), examId);
      };
    }

    function renderAdminUsers(root) {
      const users = DB.get('users');

      root.innerHTML = renderAdminLayout('users', `
        <h2 class="text-2xl font-black">إدارة الطلاب والمستخدمين</h2>
        <div class="bg-white dark:bg-slate-900 rounded-3xl border overflow-hidden shadow-sm">
          <table class="w-full text-right text-xs">
            <thead class="bg-slate-50 dark:bg-slate-800 border-b text-slate-400 font-bold">
              <tr>
                <th class="p-3">المستخدم</th>
                <th class="p-3">الدور</th>
                <th class="p-3">الحالة</th>
                <th class="p-3">إجراء</th>
              </tr>
            </thead>
            <tbody class="divide-y divide-slate-100 dark:divide-slate-800">
              ${users.map(u => `
                <tr>
                  <td class="p-3">
                    <span class="font-bold block">${u.displayName || 'بدون اسم'}</span>
                    <span class="text-slate-400 dir-ltr text-[10px] block">${u.email}</span>
                  </td>
                  <td class="p-3 font-bold">${u.role}</td>
                  <td class="p-3">
                    <span class="px-2 py-0.5 rounded-full text-[10px] font-bold ${u.disabled ? 'bg-rose-100 text-rose-700' : 'bg-emerald-100 text-emerald-700'}">
                      ${u.disabled ? 'معطل' : 'نشط'}
                    </span>
                  </td>
                  <td class="p-3">
                    <button onclick="toggleUserDisable('${u.uid}')" class="px-2 py-1 border rounded-lg text-[10px] font-bold">
                      ${u.disabled ? 'تفعيل' : 'تعطيل'}
                    </button>
                  </td>
                </tr>
              `).join('')}
            </tbody>
          </table>
        </div>
      `);
    }

    function toggleUserDisable(uid) {
      const user = DB.get('users').find(u => u.uid === uid);
      if (user) {
        DB.update('users', uid, { disabled: !user.disabled });
        showToast(user.disabled ? "تم تنشيط الحساب" : "تم تعطيل الحساب");
        renderAdminUsers(document.getElementById('app-root'));
      }
    }

    function renderAdminResults(root) {
      const attempts = DB.get('attempts');

      root.innerHTML = renderAdminLayout('results', `
        <h2 class="text-2xl font-black">سجل كافة نتائج الطلاب</h2>
        <div class="bg-white dark:bg-slate-900 rounded-3xl border overflow-hidden shadow-sm">
          <table class="w-full text-right text-xs">
            <thead class="bg-slate-50 dark:bg-slate-800 border-b text-slate-400 font-bold">
              <tr>
                <th class="p-3">الطالب</th>
                <th class="p-3">الامتحان</th>
                <th class="p-3">الدرجة</th>
                <th class="p-3">النسبة</th>
                <th class="p-3">التاريخ</th>
              </tr>
            </thead>
            <tbody class="divide-y divide-slate-100 dark:divide-slate-800">
              ${attempts.map(a => `
                <tr>
                  <td class="p-3 font-bold">${a.userName}</td>
                  <td class="p-3 text-slate-500">${a.examTitle}</td>
                  <td class="p-3 font-mono font-bold">${a.score} / ${a.totalMarks}</td>
                  <td class="p-3">
                    <span class="px-2 py-0.5 rounded-full text-[10px] font-bold ${a.passed ? 'bg-emerald-100 text-emerald-700' : 'bg-rose-100 text-rose-700'}">
                      ${a.percentage}%
                    </span>
                  </td>
                  <td class="p-3 text-slate-400">${new Date(a.submittedAt).toLocaleDateString('ar-EG')}</td>
                </tr>
              `).join('')}
            </tbody>
          </table>
        </div>
      `);
    }

    // إطلاق التطبيق فور انتهاء تحميل الـ DOM
    document.addEventListener('DOMContentLoaded', () => {
      renderCurrentRoute();
    });
    // تشغيل مباشر إذا كان الـ DOM جاهزاً بالفعل
    if (document.readyState === 'complete' || document.readyState === 'interactive') {
      renderCurrentRoute();
    }
  </script>
</body>
</html>
